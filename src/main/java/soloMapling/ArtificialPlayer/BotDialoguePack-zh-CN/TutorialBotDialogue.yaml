    wait: 1
  AnalyzePlayersWeapon:
    text:
      - "你手里那把 %WPN_NAME%..."
      - "丢地上，让我看看。"
    emote: 3
    wait: 1
  LootDialogue:
    text:
      - "嗯嗯嗯...."
      - "这是一把刚做出来的干净 %WPN_NAME%..."
      - "看仔细了。我要用赌博之力强化它。"
