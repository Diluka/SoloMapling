    wait: 2
  GiftTradeIntro:
    text:
      - "接受我的交易请求，我给你金币、药水和飞镖。"
    emote: 2
    wait: 1
  Tutorial_1:
    text:
      - "想跟别的玩家说话，要打出他们完整名字"
      - "比如想跟我说话，就输入 %CHR_NAME%"
      - "记住必须和玩家名字完全一致！"
    emote: 3
    wait: 1
  Tutorial_2:
    text:
      - "接下来，别的玩家可能会让你选回复。"
      - "要回复的话，直接输入你想选的那个选项就行（不区分大小写）"
      - "来试一下。你想留哪顶帽子？"
