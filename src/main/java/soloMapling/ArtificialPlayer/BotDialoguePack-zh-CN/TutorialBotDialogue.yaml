TutorialBot:
  Greeting:
    text:
      - "嘿 %RESP_NAME%！欢迎来到 SoloMapling！"
    emote: 2
    wait: 1
  Inquiry:
    text:
      - "这是你第一次来这个服吗？"
    emote: 6
    wait: 1
  AskAdmin:
    text:
      - "正式带你逛之前..."
      - "这个服还在内测，所以我们在找管理员帮忙。"
      - "你想当服务器管理员吗？会拿到完整 GM 权限和一些起步装备。"
