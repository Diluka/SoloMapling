# 通用城镇闲聊，供环境 bot 对 bot 对话用（BotChatterSystem）。
# 每组 exchange 是有序来回；说话人按 A、B、A、B… 交替（2-4 轮）。
# {MAP} 解析为当前说话 bot 所在地图名；某行若 token 无法解析则直接丢弃，不会原样念出。
# 行要短、口语化（v83 客户端，无 emoji）。
# 先全城镇共用（之后可用分城镇风味文件覆盖）。YAML 优先；批量生成见对话批处理 playbook。由 TownChatterLines 加载。
exchanges:
  - ["你去过天空之城了吗？", "还没，在攒船票钱", "值得，风景真的绝"]
  - ["披风不错啊", "谢谢，自己砸的卷", "羡慕，我老是炸"]
  - ["刷怪感觉怎么样？", "慢但稳", "一样，手都酸了哈哈"]
  - ["{MAP}今天挺热闹", "嗯 看到人多挺好的", "比一个人刷舒服多了"]
  - ["你在自由市场卖东西吗？", "就卖点卷", "我晚点过去看看"]
  - ["转职弄完了吗？", "昨晚终于弄完了", "恭喜！我也拖好久"]
  - ["你最近在哪练？", "就卡老地方", "经典，永不翻车"]
  - ["这附近有人组pq吗？", "不太有，全在挂机", "果然哈哈"]
  - ["你装备挺干净", "攒金币攒了好几周", "说实话值"]
  - ["你看今天爆率了吗？", "嗯今天挺给面子", "趁着还能刷多刷"]
  - ["要不要洗属性啊？", "不用 你这样挺好", "那行听你的"]
  - ["{MAP}今天有点安静", "还早呢", "对，人潮晚点才来"]
  - ["现在卷多少钱一张？", "贵疯了哈哈", "价格永远下不来啊"]
  - ["那个boss老打死我", "下次多带点药", "嗯说得对"]
  - ["你有公会吗？", "正好在找", "我帮你问问我们公会"]
  - ["有多余药水吗？", "给你几个", "救命恩人谢谢"]
  - ["今天挺累啊", "嗯就来城里歇歇", "一样，城里挺安静"]
  - ["维护把卡顿修好了吗？", "今天感觉好点了", "终于，之前真难受"]
  - ["你现在几级了？", "快到下次转职了", "好近了加油"]
  - ["这个点有人吗？", "给你，我要走了", "谢谢 回见"]
  - ["听说活动了吗？", "没有，啥活动？", "这周末双倍经验"]
  - ["帽子好看，哪来的", "商城，没忍住", "哈哈理解"]
  - ["等人吗？", "就看看人", "哈哈我也是"]
  - ["{MAP}天气真好", "现实生活就别提了", "哈哈真实"]
