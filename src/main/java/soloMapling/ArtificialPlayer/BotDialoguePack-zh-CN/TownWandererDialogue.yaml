# 通用 TownWandererBot 环境对话（除射手村外各城漫游；射手村用单独打磨的 HenesysBot 台词）。
# 行里用 {MAP} 上下文 token，同一文件在废弃都市、魔法密林、勇士部落、林中之城、天空之城、玩具城、冰峰雪域都能读通。
# 台词保持城镇无关——不要写射手村专属梗。分城镇风味文件可之后用对话批处理 playbook 加。
TownWandererBot:
  CongratsLevelUp:
    text:
      - "恭喜 {PLAYER_NAME}！"
      - "不错啊，{PLAYER_LEVEL}级"
      - "恭喜恭喜"
      - "哎嘿恭喜 {PLAYER_NAME}"
      - "{PLAYER_LEVEL}级了？可以"
      - "继续刷 {PLAYER_NAME}"
      - "干得漂亮"
      - "恭喜升级"
      - "漂亮 {PLAYER_NAME}"
      - "哦升级了，恭喜 {PLAYER_NAME}"
      - "冲啊 {PLAYER_NAME}"
      - "{PLAYER_LEVEL}级，不差"
      - "恭喜 {PLAYER_NAME}，继续冲"
      - "升到 {PLAYER_LEVEL} 不错啊"
  PlayerReaction:
    text:
      - "哦嘿"
      - "咋了"
      - "你好呀"
      - "哟"
      - "路过而已"
      - "借过借过"
      - "以前好像没在{MAP}见过你"
      - "等等我认识你吗？"
      - "嘿小心点哈哈"
      - "{MAP}天气不错啊"
      - "你是新来的？"
      - "嗯？"
      - "哦又是你哈哈"
      - "干嘛呢"
      - "欢迎回来"
      - "{MAP}今天挺安静"
      - "外面小心点"
      - "有空组队不？"
      - "*招手*"
      - "好久不见"
  WanderChat:
    text:
      - "嗯我刚要去哪来着"
      - "嗯往哪边走"
      - "出来活动下腿"
      - "{MAP}其实挺不错的"
      - "啦啦啦~"
      - "今天商店有啥打折"
      - "{MAP}最近人好多"
      - "该回去练级了"
      - "*打哈欠*"
      - "这里挺安静"
      - "喜欢{MAP}这一块"
      - "人都去哪了"
      - "再绕{MAP}一圈"
      - "这城永远不变"
      - "还差金币啊..."
      - "商店补货了没"
      - "嗯"
      - "纯打发时间"
  EmoteReaction:
    text:
      - "哈哈"
      - "哈哈笑死"
      - "不错"
      - "哦？"
      - "嗯！"
      - "嘿"
      - "那行吧"
      - "有意思"
      - "不会吧"
      - ":)"
  MapTransition:
    text:
      - "我先溜达会儿"
      - "去别处看看，回见"
      - "马上回来，去别处瞅瞅"
      - "想往那边挪挪"
      - "{MAP}回见"
      - "该换地方了"
      - "一会儿见"
      - "去别处活动下腿"
      - "换个地方走走"
      - "溜达去咯~"
