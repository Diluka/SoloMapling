#   自身:   {MAP} {REGION} {MOB} {DROP} {LEVEL}
#   玩家: {PLAYER_NAME} {PLAYER_JOB} {PLAYER_WEAPON} {PLAYER_GEAR} {PLAYER_PET} {PLAYER_GUILD}
# 带 token 的节点也有纯文本兜底行（token 解析失败时引擎重抽纯文本行）。
# 节点级 `emote` 是与抽中句子解耦的随机情绪盘；行内 {line:, emote:} 固定该行情绪。
#
# 分职业签名覆盖在兄弟键 TrainingBot_Warrior/_Mage/_Thief/_Bowman 下
# （§7 配方）。注意：处理器尚未按职业后缀合并——数据已写好；
# 接线（查找 TrainingBot_<job>.Signature 与基础池并列）仍是 TODO。

