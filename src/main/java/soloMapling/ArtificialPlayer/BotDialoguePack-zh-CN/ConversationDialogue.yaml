      - {speaker: A, text: "那是你的问题哈哈"}
      - {speaker: B, text: "作息这节点彻底毁了", emote: 4}
      - {speaker: A, text: "夏日氛围"}

  fm_price_outrage:
    participants: 3
    lines:
      - {speaker: A, text: "哥们有人白卷卖2亿了"}
      - {speaker: B, text: "上周8000万咋了"}
      - {speaker: C, text: "倒爷来了。全买抬价"}
      - {speaker: A, text: "真恶心", emote: 5}
      - {speaker: B, text: "供需宝贝。欢迎自由市场"}
      - {speaker: C, text: "所以我一直穷。拒绝参与"}
      - {speaker: A, text: "那是精神吧"}

  anime_music_grind:
    participants: 2
    lines:
      - {speaker: A, text: "刷怪听啥"}
      - {speaker: B, text: "基本动漫OP。火影死神犬夜叉"}
      - {speaker: A, text: "经典。安静图我加古典钢琴"}
      - {speaker: B, text: "古典配射手村图真好"}
      - {speaker: A, text: "打扎昆放火影OST最棒"}
      - {speaker: B, text: "宅与游戏人交汇", emote: 2}

  food_while_gaming:
    participants: 3
    lines:
      - {speaker: A, text: "大家游戏零食？"}
      - {speaker: B, text: "辣条。键盘永久橙"}
      - {speaker: C, text: "恶心。我吃葡萄像文明人"}
      - {speaker: A, text: "葡萄？？好随机哈哈"}
      - {speaker: B, text: "不葡萄游戏其实好。不脏"}
      - {speaker: C, text: "谢谢。有人懂", emote: 3}
      - {speaker: A, text: "我个人薯片蘸酱"}
      - {speaker: B, text: "你可怜键盘…"}

  guild_drama:
    participants: 2
    lines:
      - {speaker: A, text: "听说Legends公会戏了吗？"}
      - {speaker: B, text: "哪部分那儿总有戏哈哈"}
      - {speaker: A, text: "会长踢了大概5人因为不去boss"}
      - {speaker: B, text: "狠。有人冒险岛外有生活"}
      - {speaker: A, text: "他们走前也这么说"}
      - {speaker: B, text: "公会政治疯了伙计"}

  dying_at_boss:
    participants: 4
    lines:
      - {speaker: A, text: "好大家都准备好扎昆吗？"}
      - {speaker: B, text: "天生准备好"}
      - {speaker: C, text: "等等让我吃药"}
      - {speaker: D, text: "我忘带药了"}
      - {speaker: A, text: "D…认真？", emote: 5}
      - {speaker: B, text: "笑死每次"}
      - {speaker: D, text: "马上回给我两分钟", emote: 7}
      - {speaker: C, text: "所以我们从没准时通"}
      - {speaker: A, text: "慢慢来吧…"}

  typing_speed:
    participants: 2
    lines:
      - {speaker: A, text: "你打字为啥这么快"}
      - {speaker: B, text: "多年冒险岛聊天吵架哈哈"}
      - {speaker: A, text: "说真大概100wpm？"}
      - {speaker: B, text: "不知道也许。从没测。肌肉记忆了"}
      - {speaker: A, text: "我大概40好慢", emote: 4}
      - {speaker: B, text: "再玩五年冒险岛你到"}

  fashion_compliment:
    participants: 2
    lines:
      - {speaker: A, text: "哟你穿搭着火"}
      - {speaker: B, text: "谢！商城待太久哈哈", emote: 7}
      - {speaker: A, text: "颜色搭配真到位"}
      - {speaker: B, text: "我对像素时尚很认真"}
      - {speaker: A, text: "致敬。我角色像小丑"}

  old_maple_nostalgia:
    participants: 3
    lines:
      - {speaker: A, text: "记得枫叶岛真有人吗"}
      - {speaker: B, text: "还得跟每个NPC聊才知道去哪"}
      - {speaker: C, text: "想念在废弃下水道迷路"}
      - {speaker: A, text: "里面音乐有点吓人"}
      - {speaker: B, text: "那时一切都是冒险。现在就冲200"}
      - {speaker: C, text: "大概长大了吧", emote: 4}
      - {speaker: A, text: "我不哭你哭"}

  death_note_debate:
    participants: 2
    lines:
      - {speaker: A, text: "热看法：L死后死亡笔记垮了"}
      - {speaker: B, text: "那都不算热看法那是事实"}
      - {speaker: A, text: "Near和Mello比L中太多"}
      - {speaker: B, text: "Near字面是没性格的L"}
      - {speaker: A, text: "该第25集结束"}
      - {speaker: B, text: "薯片那幕传奇。留下。", emote: 3}

  build_pc_advice:
    participants: 3
    lines:
      - {speaker: A, text: "想装机。有建议吗？"}
      - {speaker: B, text: "预算？"}
      - {speaker: A, text: "大概800-1000"}
      - {speaker: C, text: "那预算能扎实配置。锐龙5+还行显卡"}
      - {speaker: B, text: "电源别省。信我"}
      - {speaker: A, text: "记下。显卡推荐？"}
      - {speaker: C, text: "看你玩不玩冒险岛以外哈哈"}
      - {speaker: B, text: "冒险岛烤箱能跑。想买啥买啥", emote: 2}
      - {speaker: A, text: "我也玩别的好吗"}

  jump_quest_rage:
    participants: 2
    lines:
      - {speaker: A, text: "这跳跳卡45分钟了"}
      - {speaker: B, text: "哪个"}
      - {speaker: A, text: "冰峰雪域小平台那个"}
      - {speaker: B, text: "哦不。上周我花两小时", emote: 4}
      - {speaker: A, text: "我要疯了。老在同地方掉"}
      - {speaker: B, text: "提示：别看计时器更糟"}
      - {speaker: A, text: "太晚心态已不可修复", emote: 5}

  stranger_interaction:
    participants: 2
    lines:
      - {speaker: A, text: "嘿"}
      - {speaker: B, text: "啥事"}
      - {speaker: A, text: "披风不错"}
      - {speaker: B, text: "哦谢哈哈。随机掉的其实"}
      - {speaker: A, text: "欧。想弄一个一阵了"}
      - {speaker: B, text: "总会有的。运气那样"}
      - {speaker: A, text: "嗯。刷啥好运"}
      - {speaker: B, text: "你也伙计。慢慢来", emote: 2}

  weekend_plans_convo:
    participants: 4
    lines:
      - {speaker: A, text: "这周末有计划吗？"}
      - {speaker: B, text: "睡觉和冒险岛。就这。"}
      - {speaker: C, text: "周六上班周日空"}
      - {speaker: D, text: "周六晚有局但之后上"}
      - {speaker: A, text: "那周日该群体boss跑"}
      - {speaker: B, text: "我整周末空。说时间"}
      - {speaker: C, text: "周日下午我行"}
      - {speaker: D, text: "大概宿醉但行", emote: 6}
      - {speaker: A, text: "完美。周日美东3点。到或方"}

  afk_return:
    participants: 2
    lines:
      - {speaker: A, text: "哟你在吗？"}
      - {speaker: A, text: "喂？？"}
      - {speaker: B, text: "抱歉哈哈挂机了。妈叫吃饭"}
      - {speaker: A, text: "哥们大概20分钟以为你掉线", emote: 6}
      - {speaker: B, text: "没有就吃饭。回来了咋了"}
      - {speaker: A, text: "没事了我忘了要说啥哈哈"}

  conspiracy_theory_silly:
    participants: 3
    lines:
      - {speaker: A, text: "我觉得爆率跟时段有关"}
      - {speaker: B, text: "不是这么工作的哈哈"}
      - {speaker: C, text: "不等等我发誓凌晨三点掉更好"}
      - {speaker: A, text: "看我不唯一"}
      - {speaker: B, text: "那只是确认偏误兄弟们"}
      - {speaker: C, text: "好那解释为啥昨晚四点掉三个稀有"}
      - {speaker: A, text: "服务器知道你多急", emote: 3}
      - {speaker: B, text: "你们妄想但今晚我试试以防万一"}

  scroll_gamble_regret:
    participants: 2
    lines:
      - {speaker: A, text: "刚砸工作手套想10连炸了", emote: 4}
      - {speaker: B, text: "哦不。用了几洞"}
      - {speaker: A, text: "5洞 过2然后炸。想哭"}
      - {speaker: B, text: "哥们过2就该停已经干净"}
      - {speaker: A, text: "我感觉欧。大错"}
      - {speaker: B, text: "总感觉欧直到炸哈哈"}
      - {speaker: A, text: "再不碰10%卷。永不。", emote: 5}
      - {speaker: B, text: "大家都这么说然后下周又干"}

  henesys_nostalgia:
    participants: 3
    lines:
      - {speaker: A, text: "记得射手村到处站人吗"}
      - {speaker: B, text: "天哪对射手村市场好氛围"}
      - {speaker: C, text: "人自由聊天文字卖。好乱"}
      - {speaker: A, text: "我以前在那晃几小时都不正经玩"}
      - {speaker: B, text: "像城镇广场。大家都摸鱼"}
      - {speaker: C, text: "每五秒全大写刷出的人", emote: 3}
      - {speaker: A, text: "说实话虽烦有点想"}
      - {speaker: B, text: "一样。怪方式感觉活着"}

  training_map_crowded:
    participants: 2
    lines:
      - {speaker: A, text: "哥们我练级图大概4个人"}
      - {speaker: B, text: "啥图"}
      - {speaker: A, text: "我在龙和今天大家都决定来"}
      - {speaker: B, text: "恨。图挤经验就死"}
      - {speaker: A, text: "字面只有正常40%", emote: 5}
      - {speaker: B, text: "换频吧"}
      - {speaker: A, text: "我查哪儿都满 就是那种天"}
      - {speaker: B, text: "周末人潮。每周六像发条"}
      - {speaker: A, text: "也许自由市场等着"}

  guild_drama_aftermath:
    participants: 3
    lines:
      - {speaker: A, text: "所以听说redleaf昨晚咋了"}
      - {speaker: B, text: "没有咋了"}
      - {speaker: A, text: "velkan基本公会聊天点名GM被踢"}
      - {speaker: C, text: "等等velkan是14x那个？？"}
      - {speaker: A, text: "对。整件事爆了。之后大概6人走"}
      - {speaker: B, text: "他气啥"}
      - {speaker: A, text: "好像boss掉落不公"}
      - {speaker: C, text: "那戏酝酿几周了", emote: 6}
      - {speaker: B, text: "公会总因掉落分配散。每次"}

  rare_drop_moment:
    participants: 2
    lines:
      - {speaker: A, text: "哥们我刚掉了星耳环", emote: 12}
      - {speaker: B, text: "不可能。从啥？？"}
      - {speaker: A, text: "小巴洛古。完全没想到"}
      - {speaker: B, text: "最低大概30万掉。恭喜！！！"}
      - {speaker: A, text: "我有点抖哈哈从不掉稀有"}
      - {speaker: B, text: "这是你冒险岛时刻。别卖太便宜"}
      - {speaker: A, text: "已去自由市场查价", emote: 11}
      - {speaker: B, text: "好运。肯定有人要"}

  bishop_appreciation:
    participants: 2
    lines:
      - {speaker: A, text: "就想说主教是游戏最被低估职业"}
      - {speaker: B, text: "大声说。没人尊重治疗加buff刷"}
      - {speaker: A, text: "带队打扎昆伤害贡献一半"}
      - {speaker: B, text: "大家还指望你驱散复活连好好说都没有"}
      - {speaker: A, text: "有人给我连复活三次一句话没有。连谢都没有"}
      - {speaker: B, text: "至少说请天哪", emote: 5}
      - {speaker: A, text: "好主教值自己体重的金币 人没意识到"}
      - {speaker: B, text: "讲。我开一个就为懂这苦"}

  meso_saving_debate:
    participants: 3
    lines:
      - {speaker: A, text: "我想存5000万。两周啥都不买"}
      - {speaker: B, text: "5000万干啥"}
      - {speaker: A, text: "想要扎昆头盔。现在价格疯了"}
      - {speaker: C, text: "自己进扎昆跑能进队就行"}
      - {speaker: A, text: "我还没140进不去"}
      - {speaker: B, text: "买更快。就需要耐心"}
      - {speaker: C, text: "我存三周准备买结果价格跌了哈哈", emote: 6}
      - {speaker: A, text: "那是我噩梦场景"}
      - {speaker: B, text: "有金币就买别等。价格只往一边走"}

  class_switch_temptation:
    participants: 2
    lines:
      - {speaker: A, text: "老想转影武者"}
      - {speaker: B, text: "你战士吧。为啥换"}
      - {speaker: A, text: "影武看着酷boss好像好玩多了"}
      - {speaker: B, text: "资金要求狠。匕首不便宜"}
      - {speaker: A, text: "知道但矛骑士这节点有点腻"}
      - {speaker: B, text: "经典隔壁草更绿。影武也抱怨哈哈"}
      - {speaker: A, text: "他们抱怨啥"}
      - {speaker: B, text: "主要资金。还有暗杀有时空", emote: 3}
      - {speaker: A, text: "好好吧先继续矛。但我还想着"}

  free_market_haggling:
    participants: 2
    lines:
      - {speaker: A, text: "你冒险岛灵魂盾90万但我别处见过60万"}
      - {speaker: B, text: "那些大概属性不一样比前先看"}
      - {speaker: A, text: "属性看着一样。11防标准吧"}
      - {speaker: B, text: "我能做到85万。最低了"}
      - {speaker: A, text: "我出75万。这图公平价"}
      - {speaker: B, text: "80万给你。最终价"}
      - {speaker: A, text: "…好。80万。成交", emote: 2}
      - {speaker: B, text: "合作愉快。享受盾"}

  skill_build_argument:
    participants: 3
    lines:
      - {speaker: A, text: "刺客该先满加速再幸运七"}
      - {speaker: B, text: "不可能永远先幸运七。前期伤害更重要"}
      - {speaker: A, text: "但加速一切更顺攻击速度重要"}
      - {speaker: C, text: "两种都试过。练级速度幸运七先对"}
      - {speaker: B, text: "谢谢终于有人同意"}
      - {speaker: A, text: "你们都错我坚持", emote: 5}
      - {speaker: C, text: "有法师加速可以更久跳过加速"}
      - {speaker: B, text: "那是另一场辩论"}
      - {speaker: A, text: "说实话选一个坚持。都行"}

  orbis_pq_memories:
    participants: 2
    lines:
      - {speaker: A, text: "还有人打天空组队还是死了"}
      - {speaker: B, text: "挺安静。以前天空塔挤爆"}
      - {speaker: A, text: "排队残忍但怪方式好玩"}
      - {speaker: B, text: "入口大厅站着交了好多随机朋友"}
      - {speaker: A, text: "去天空的船基本社交时间"}
      - {speaker: B, text: "路上一起打怪就摸鱼", emote: 2}
      - {speaker: A, text: "冒险岛闲时最好。存在着就好玩"}
      - {speaker: B, text: "天空组队本身有好队也挺好玩"}

  dark_knight_vs_hero:
    participants: 2
    lines:
      - {speaker: A, text: "boss黑骑还是英雄。说"}
      - {speaker: B, text: "英雄。灵魂使酷但实践英雄更多"}
      - {speaker: A, text: "黑骑有灵魂使buff和牺牲超大工具"}
      - {speaker: B, text: "英雄有狂怒连击爆发。长战纯伤害赢"}
      - {speaker: A, text: "黑骑更肉混沌跑重要"}
      - {speaker: B, text: "有道理。专打扎昆黑骑大概更安全"}
      - {speaker: A, text: "我就是觉得灵魂使看着酷那也算分", emote: 3}
      - {speaker: B, text: "选职业有效理由说实话。审美重要"}

  party_buffing_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "能不能说好施法前说祝福不是之后"}
      - {speaker: B, text: "哈哈咋了"}
      - {speaker: A, text: "主教一开跑就盖我加速"}
      - {speaker: C, text: "哦。祝福加速叠会乱"}
      - {speaker: B, text: "理想开跑前组队聊天说顺序"}
      - {speaker: A, text: "但从没人做。大家直接开"}
      - {speaker: C, text: "我总先法师buff再战士再牧师。行"}
      - {speaker: B, text: "那该成通用标准说实话", emote: 2}
      - {speaker: A, text: "传开。buff顺序救命"}

  late_night_grind:
    participants: 2
    lines:
      - {speaker: A, text: "凌晨两点还在骷髅刷。救命"}
      - {speaker: B, text: "一样。苦力还停不了。再一级"}
      - {speaker: A, text: "再一级已骗自己三小时", emote: 14}
      - {speaker: B, text: "晚上服务器安静经验条动得好爽"}
      - {speaker: A, text: "对。怪方式平静"}
      - {speaker: B, text: "大概四小时后要起哈哈"}
      - {speaker: A, text: "一样但冒险岛时间不在乎现实时间"}
      - {speaker: B, text: "好好这次真下了"}
      - {speaker: A, text: "行吧。大概三十分钟见"}

  quitting_and_returning:
    participants: 2
    lines:
      - {speaker: A, text: "实际退了大概八个月上周才回"}
      - {speaker: B, text: "欢迎回来哈哈。为啥回来"}
      - {speaker: A, text: "说实话怀旧来了。想念氛围"}
      - {speaker: B, text: "人人都这样。这游戏有引力"}
      - {speaker: A, text: "惊讶构建和点还记得这么多"}
      - {speaker: B, text: "肌肉记忆不忘。手指知道连招", emote: 2}
      - {speaker: A, text: "有的要重学但捡得快"}
      - {speaker: B, text: "冒险岛就是这样。总像回家"}

  fame_farming_discussion:
    participants: 3
    lines:
      - {speaker: A, text: "还有人在乎人气吗"}
      - {speaker: B, text: "不太但看着涨还是开心"}
      - {speaker: C, text: "有的店进价还看人气"}
      - {speaker: A, text: "老自由市场交易前查人气好怪"}
      - {speaker: B, text: "我大概200人气才发现没人查", emote: 6}
      - {speaker: C, text: "跟人气跑跟路人配对其实挺社交"}
      - {speaker: A, text: "对。人气跑认识酷的人"}
      - {speaker: B, text: "基本每天有理由跟陌生人聊"}

  fm_room_navigation:
    participants: 2
    lines:
      - {speaker: A, text: "为啥自由市场房号这么乱"}
      - {speaker: B, text: "对。找人在自由市场迷路十分钟"}
      - {speaker: A, text: "总忘哪个传送去哪区"}
      - {speaker: B, text: "狂进希望最好是我策略", emote: 3}
      - {speaker: A, text: "地图技术上有但完全没帮助"}
      - {speaker: B, text: "谁设计自由市场布局有独特愿景"}
      - {speaker: A, text: "我背需要的店直接去"}
      - {speaker: B, text: "学会布局就是肌肉记忆。要几周"}

  boss_prep_checklist:
    participants: 2
    lines:
      - {speaker: A, text: "扎昆三十分钟后。准备好了吗"}
      - {speaker: B, text: "先得再买大概300红药"}
      - {speaker: A, text: "至少还要一包万能药。手臂打得疼"}
      - {speaker: B, text: "要命中装还是基础命中够"}
      - {speaker: A, text: "你这级基础该够。以防万一戴个命中戒"}
      - {speaker: B, text: "好现在买药。你有复活准备吗"}
      - {speaker: A, text: "主教朋友说有所以该覆盖"}
      - {speaker: B, text: "好。手臂阶段我总死至少一次哈哈", emote: 7}
      - {speaker: A, text: "说实话一样。硬扛过去"}

  alt_character_confession:
    participants: 3
    lines:
      - {speaker: A, text: "我有4个小号有罪恶感"}
      - {speaker: B, text: "为啥有罪。小号正常"}
      - {speaker: A, text: "因为没有过60级还一直开新的"}
      - {speaker: C, text: "哦不你是跳号党。我一看就知", emote: 3}
      - {speaker: A, text: "对新职业兴奋然后失兴趣"}
      - {speaker: B, text: "新号前30级感觉好新鲜"}
      - {speaker: C, text: "然后撞刷墙又开新号"}
      - {speaker: A, text: "正是。循环破不了"}
      - {speaker: B, text: "某节点会粘住一个。得找到你职业"}

  nx_cosmetic_priorities:
    participants: 2
    lines:
      - {speaker: A, text: "要有3万点券先花啥"}
      - {speaker: B, text: "发型券没悬念。啥之前先好看"}
      - {speaker: A, text: "想商城那套整体挺好看"}
      - {speaker: B, text: "黄昏流浪者套？对干净"}
      - {speaker: A, text: "帽子位难。跟多数装备帽撞"}
      - {speaker: B, text: "所以现金帽总优先。解放时尚"}
      - {speaker: A, text: "有道理。现金帽然后套装还是发型？"}
      - {speaker: B, text: "发型先。其他都次于发型", emote: 3}

  el_nath_cold_complaints:
    participants: 2
    lines:
      - {speaker: A, text: "为啥冰峰雪域寒冷debuff每次还烦我"}
      - {speaker: B, text: "是屏上雪花吧。好分心"}
      - {speaker: A, text: "一切感觉迟钝又丑"}
      - {speaker: B, text: "上山前底下NPC拿解毒"}
      - {speaker: A, text: "每次来都忘。每次"}
      - {speaker: B, text: "至少不被三秒冻一次时图挺好看"}
      - {speaker: A, text: "上面音乐不错。很有氛围"}
      - {speaker: B, text: "冰峰氛围加分。寒冷机制减分", emote: 4}

  pq_partner_search:
    participants: 3
    lines:
      - {speaker: A, text: "找玩具组队。再缺3个拜托"}
      - {speaker: B, text: "你做啥等级段"}
      - {speaker: A, text: "35到50都行。有牧师buff覆盖"}
      - {speaker: C, text: "哦我41能加吗"}
      - {speaker: A, text: "能！！啥职业"}
      - {speaker: C, text: "冰雷法师。闪电准备好"}
      - {speaker: B, text: "巨人阶段挺强。我也来我是飞侠"}
      - {speaker: A, text: "完美走。入口传送见", emote: 11}

  scroll_success_witness:
    participants: 2
    lines:
      - {speaker: A, text: "哟我刚看有人工作手套连续砸70%七次"}
      - {speaker: B, text: "疯了。概率多少"}
      - {speaker: A, text: "他们疯了。字面在自由市场跳"}
      - {speaker: B, text: "该。70%连砸七次是奇迹"}
      - {speaker: A, text: "干净工作手套砸到接近完美。看着疯"}
      - {speaker: B, text: "复制大概要五千万黑卷", emote: 12}
      - {speaker: A, text: "正是。传奇自由市场时刻。人在欢呼"}
      - {speaker: B, text: "希望我当时在"}

  leveling_speed_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你到120花多久"}
      - {speaker: B, text: "说实话休闲大概三个月。也许四"}
      - {speaker: A, text: "不差。我118卡大概三周"}
      - {speaker: B, text: "115到120墙是真的。经验需求猛涨"}
      - {speaker: A, text: "我在骷髅但图竞争残忍"}
      - {speaker: B, text: "试非高峰。真深夜或清晨"}
      - {speaker: A, text: "也许定六点闹钟 听着疯但"}
      - {speaker: B, text: "做过。不羞耻。黎明空图是金", emote: 2}

  guild_boss_run_planning:
    participants: 4
    lines:
      - {speaker: A, text: "好公会扎昆周六7点。谁能来"}
      - {speaker: B, text: "我到。之前要补药"}
      - {speaker: C, text: "工作到6但最晚7:30上"}
      - {speaker: D, text: "我空。这次确认有主教吗"}
      - {speaker: A, text: "太阳说能来所以有复活"}
      - {speaker: B, text: "还要招人还是我们有6"}
      - {speaker: C, text: "理想至少8人顺跑"}
      - {speaker: A, text: "我发招人聊天。再需2"}
      - {speaker: D, text: "确保至少100防装备。上次惨", emote: 5}

  losing_track_of_time:
    participants: 2
    lines:
      - {speaker: A, text: "哥们坐下玩一小时现在五小时了"}
      - {speaker: B, text: "冒险岛时间另一套钟。已知现象"}
      - {speaker: A, text: "真以为大概九点其实午夜"}
      - {speaker: B, text: "公平说你大概进心流了", emote: 3}
      - {speaker: A, text: "组队链一直秒找到队"}
      - {speaker: B, text: "队流着时就是不想停"}
      - {speaker: A, text: "明天早上还有课。决策真棒"}
      - {speaker: B, text: "经历过。但值得对吧"}
      - {speaker: A, text: "…说实话值得", emote: 2}

  training_spot_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "有人已在图练你换频还是留"}
      - {speaker: B, text: "看图大小。大图可分享 小图换"}
      - {speaker: C, text: "我总先问。嘿这图有人吗那种"}
      - {speaker: A, text: "多数人问了就冷静。烦人是不问直接挤"}
      - {speaker: B, text: "对烦人。至少跟另一人打个招呼"}
      - {speaker: C, text: "有人一句话不开直接旁边练", emote: 6}
      - {speaker: A, text: "然后得你提起 尴尬"}
      - {speaker: B, text: "练级图社交契约是真的得尊重"}

  mage_skill_rotation:
    participants: 2
    lines:
      - {speaker: A, text: "火毒法师boss循环咋打"}
      - {speaker: B, text: "基本毒雾然后流星 元素增幅触发就接"}
      - {speaker: A, text: "空档穿普攻还是等毒跳"}
      - {speaker: B, text: "空档丢火箭。毒跳时伤害不断"}
      - {speaker: A, text: "减速对boss和练级点多重要"}
      - {speaker: B, text: "boss多数免疫不太有用。普通练级大"}
      - {speaker: A, text: "有道理。火毒感觉复杂但点上爽"}
      - {speaker: B, text: "肯定更主动玩法之一。从不无聊", emote: 2}

  henesys_market_gossip:
    participants: 3
    lines:
      - {speaker: A, text: "射手村有人半价卖飞镖"}
      - {speaker: B, text: "大概假货或者急要金币"}
      - {speaker: C, text: "我看见了。属性看着真"}
      - {speaker: A, text: "也许清仓。有时发生"}
      - {speaker: B, text: "或者倒爷装便宜别处翻"}
      - {speaker: C, text: "哇从没想到这角度。阴", emote: 6}
      - {speaker: A, text: "有人把自由市场当整套商业策略"}
      - {speaker: B, text: "而且赚的比谁刷都多哈哈"}

  slow_leveling_acceptance:
    participants: 2
    lines:
      - {speaker: A, text: "我73级两周了不羞耻"}
      - {speaker: B, text: "说实话好心态。这游戏是马拉松"}
      - {speaker: A, text: "想玩才玩。不急特定目标"}
      - {speaker: B, text: "希望我能那样。我太盯等级数字"}
      - {speaker: A, text: "享受旅程别追终点就有帮助"}
      - {speaker: B, text: "好智慧。你暗地哲学家还是懒哈哈"}
      - {speaker: A, text: "也许都有一点", emote: 3}
      - {speaker: B, text: "致敬。这对话后我试着对等级放松"}

  warrior_weapon_debate:
    participants: 2
    lines:
      - {speaker: A, text: "黑骑终局长柄还是矛。哪个更好"}
      - {speaker: B, text: "长柄打更多目标练级好但矛单体更高"}
      - {speaker: A, text: "专打扎昆我想矛打手臂"}
      - {speaker: B, text: "对矛对boss构建更合理"}
      - {speaker: A, text: "攻速差多少。很重要吗"}
      - {speaker: B, text: "加速开挺接近。长柄AOE略胜"}
      - {speaker: A, text: "唉。为啥不能简单"}
      - {speaker: B, text: "战士总这辩论。选手感好的", emote: 2}

  drop_rate_conspiracy:
    participants: 2
    lines:
      - {speaker: A, text: "我发誓连杀时爆率更差"}
      - {speaker: B, text: "像游戏惩罚你太顺"}
      - {speaker: A, text: "正是。连杀500啥没有。杀3稀有掉"}
      - {speaker: B, text: "字面随机在跟你期望作对哈哈"}
      - {speaker: A, text: "我知道但不感觉随机"}
      - {speaker: B, text: "那是你脑子在无模式处找模式", emote: 3}
      - {speaker: A, text: "我脑子错但好确信"}
      - {speaker: B, text: "经典冒险岛体验。投入时运气感觉不一样"}

  maple_anniversary_memories:
    participants: 3
    lines:
      - {speaker: A, text: "以前周年活动好好"}
      - {speaker: B, text: "蛋糕怪图！！好乱好好玩"}
      - {speaker: C, text: "大家刷周年币换活动戒"}
      - {speaker: A, text: "还有发的免费道具。像派对"}
      - {speaker: B, text: "周年帽稀有之后永远秀"}
      - {speaker: C, text: "我仓库号某处还有第一顶周年帽"}
      - {speaker: A, text: "那些活动让你感觉全服一起庆祝", emote: 2}
      - {speaker: B, text: "那时冒险岛知道怎么做社区活动"}

  party_finding_struggle:
    participants: 2
    lines:
      - {speaker: A, text: "找组队找了25分钟。没人招"}
      - {speaker: B, text: "啥组队"}
      - {speaker: A, text: "废弃组队。有人等但没人想带"}
      - {speaker: B, text: "经典。都想加没人想组织"}
      - {speaker: A, text: "我想带但还不全会解谜"}
      - {speaker: B, text: "论坛有攻略。五分钟学基础"}
      - {speaker: A, text: "也许我直接带。能有多难"}
      - {speaker: B, text: "你会很好。说第一次带人通常耐心", emote: 2}

  potion_expense_complaining:
    participants: 3
    lines:
      - {speaker: A, text: "上周药花了两百万金币。两百万"}
      - {speaker: B, text: "你几级。好像很多"}
      - {speaker: A, text: "我130骷髅狂吃药"}
      - {speaker: C, text: "试过万能药代替红药吗。有时金币效率更高"}
      - {speaker: A, text: "前期更贵但更耐用吧"}
      - {speaker: B, text: "真修是交主教朋友哈哈。神圣守护加奶改一切"}
      - {speaker: C, text: "跟主教搭子刷药费大概掉一半"}
      - {speaker: A, text: "按需主教朋友哪获取", emote: 6}
      - {speaker: B, text: "公会招人。总在找主教"}

  guild_recruitment_pitch:
    participants: 2
    lines:
      - {speaker: A, text: "嘿想入会吗。我们挺活跃"}
      - {speaker: B, text: "啥样公会"}
      - {speaker: A, text: "休闲但一周两次boss。20人"}
      - {speaker: B, text: "有等级要求吗"}
      - {speaker: A, text: "过二转就行。不太在乎等级"}
      - {speaker: B, text: "氛围咋样。肝还是玩"}
      - {speaker: A, text: "主要玩。公会聊天老开玩笑"}
      - {speaker: B, text: "好其实听着不错。怎么加", emote: 2}
      - {speaker: A, text: "现在发邀请。欢迎上船"}

  job_advance_celebration:
    participants: 3
    lines:
      - {speaker: A, text: "兄弟们我刚三转了", emote: 12}
      - {speaker: B, text: "冲啊。转啥了"}
      - {speaker: A, text: "黑暗骑士宝贝。灵魂使归我了"}
      - {speaker: C, text: "哦黑暗骑士好酷。真恭喜"}
      - {speaker: A, text: "任务有点烦但值"}
      - {speaker: B, text: "灵魂使用着感觉咋样"}
      - {speaker: A, text: "绝了。像有小伙伴跟着加buff"}
      - {speaker: C, text: "灵魂使牺牲boss会救命信我", emote: 2}
      - {speaker: A, text: "这是几个月来冒险岛最好一天"}

  losing_a_good_scroll:
    participants: 2
    lines:
      - {speaker: A, text: "浴袍60%砸炸了我想停玩"}
      - {speaker: B, text: "唉。已经有啥了"}
      - {speaker: A, text: "已经过两次60%。本该帽子戏法"}
      - {speaker: B, text: "第三次炸了。残酷讽刺"}
      - {speaker: A, text: "早该停在两次。已知好物对未知贪"}
      - {speaker: B, text: "两过浴袍还是扎实货。别扔", emote: 4}
      - {speaker: A, text: "知道。就哀悼本可以"}
      - {speaker: B, text: "给十分钟。会好点。砸卷哀是暂时的"}

  unexpected_pk_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "有人僵尸蘑菇抢我怪还叫我萌新"}
      - {speaker: B, text: "哈哈经典。你咋办"}
      - {speaker: A, text: "我DPS压过他们占整图他们怒退"}
      - {speaker: B, text: "正义。被抢正确回应"}
      - {speaker: A, text: "他们带朋友回来两边夹击"}
      - {speaker: B, text: "他们为僵尸蘑菇组织整套报复？", emote: 6}
      - {speaker: A, text: "认真的。那节点我换图了"}
      - {speaker: B, text: "有时图不值这戏哈哈"}

  old_friend_reunion:
    participants: 3
    lines:
      - {speaker: A, text: "等等。那是mikiryu？哥们你去哪了"}
      - {speaker: B, text: "哦哇。大概去年没见你"}
      - {speaker: A, text: "字面以为你真退了"}
      - {speaker: B, text: "有点退了但太想了"}
      - {speaker: C, text: "等等你们认识？"}
      - {speaker: A, text: "以前一起打扎昆"}
      - {speaker: B, text: "那最好。记得整队死只剩我们"}
      - {speaker: A, text: "不知怎么单刷最后30%血。传奇跑", emote: 11}
      - {speaker: C, text: "好那其实好故事我想听完整版"}
      - {speaker: B, text: "晚点好好讲。就高兴回来了"}

  # ═══════════════════════════════════════
  #  ADDITIONAL CONVERSATIONS (BATCH 2)
  # ═══════════════════════════════════════

  hp_washing_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你洗血吗"}
      - {speaker: B, text: "洗一点。烦但boss有帮助"}
      - {speaker: A, text: "AP重置值吗。那些贵"}
      - {speaker: B, text: "看你多认真boss。扎昆有点必要"}
      - {speaker: A, text: "不知道感觉花金币好无聊", emote: 6}
      - {speaker: B, text: "无聊但扎昆不会一下死那就那"}
      - {speaker: A, text: "我想死也无聊"}

  trade_gone_wrong:
    participants: 2
    lines:
      - {speaker: A, text: "哟你卖那耳环吗"}
      - {speaker: B, text: "对1200万"}
      - {speaker: A, text: "好交易我"}
      - {speaker: B, text: "等等你挂120万不是1200万"}
      - {speaker: A, text: "哦笑死我看错。以为你说120万", emote: 7}
      - {speaker: B, text: "哥们差一个小数点", emote: 5}
      - {speaker: A, text: "抱歉抱歉。反正没1200万卖的好运"}

  falling_asleep_at_keyboard:
    participants: 2
    lines:
      - {speaker: A, text: "嘿看见刚才怪掉了吗？"}
      - {speaker: A, text: "喂？"}
      - {speaker: A, text: "哥们你字面站地图中间"}
      - {speaker: B, text: "啊啥。抱歉趴键盘睡着了", emote: 6}
      - {speaker: A, text: "笑死我就知道。角色十分钟没动"}
      - {speaker: B, text: "梦见还在刷。算经验吗"}
      - {speaker: A, text: "去睡觉哥们"}

  pet_naming_stories:
    participants: 3
    lines:
      - {speaker: A, text: "你们宠叫啥名"}
      - {speaker: B, text: "我的叫金币。因为他只捡那个"}
      - {speaker: C, text: "我用现实猫名。面条", emote: 2}
      - {speaker: A, text: "面条好可爱。我的就叫狗"}
      - {speaker: B, text: "你给龙…取名狗？", emote: 6}
      - {speaker: A, text: "命名屏慌了好吗"}
      - {speaker: C, text: "龙叫狗。说实话标志"}

  best_map_for_level_range:
    participants: 3
    lines:
      - {speaker: A, text: "好我们大概55-60。最好图啥"}
      - {speaker: B, text: "肯定猴子公园3。模特我们级经验疯"}
      - {speaker: C, text: "不幽灵船更好。竞争少掉落还行"}
      - {speaker: A, text: "虾兵呢。听说也不错"}
      - {speaker: B, text: "有宠捡东西虾兵好。否则猴子公园3"}
      - {speaker: C, text: "幽灵船被低估我发誓。大家都忽略"}
      - {speaker: A, text: "好幽灵船试一小时差就回猴子公园3"}

  dark_scroll_gamble:
    participants: 2
    lines:
      - {speaker: A, text: "披风该黑卷还是砸60%"}
      - {speaker: B, text: "你多爱那披风"}
      - {speaker: A, text: "很多。花了4000万"}
      - {speaker: B, text: "那就别黑卷。炸一次永远没了", emote: 5}
      - {speaker: A, text: "但过了属性…"}
      - {speaker: B, text: "大家都炸装备前这么说"}
      - {speaker: A, text: "好好60%。我选和平", emote: 7}

  mount_quest_struggle:
    participants: 2
    lines:
      - {speaker: A, text: "做坐骑任务了吗"}
      - {speaker: B, text: "哪部分。收集怪物卡那个"}
      - {speaker: A, text: "对收集卡。好久"}
      - {speaker: B, text: "我刷大概三天完成"}
      - {speaker: A, text: "三天？？", emote: 5}
      - {speaker: B, text: "有些卡爆率残忍"}
      - {speaker: A, text: "这之后最好是游戏最酷坐骑"}

  random_defame_rage:
    participants: 2
