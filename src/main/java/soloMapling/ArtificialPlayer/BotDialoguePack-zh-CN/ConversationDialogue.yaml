conversations:

  # ═══════════════════════════════════════
  #  双人对话
  # ═══════════════════════════════════════

  training_spot_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你在哪练级？"}
      - {speaker: B, text: "基本猪海滩"}
      - {speaker: A, text: "那不是有点慢？", emote: 5}
      - {speaker: B, text: "对但舒服 没人烦我"}
      - {speaker: A, text: "行吧哈哈"}

  training_spot_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "45级该去哪练？"}
      - {speaker: B, text: "猴子公园3或者虾兵"}
      - {speaker: A, text: "哪个快"}
      - {speaker: B, text: "有宠去虾兵 没宠猴子公园3"}
      - {speaker: A, text: "好谢啦！", emote: 2}

  class_debate:
    participants: 2
    lines:
      - {speaker: A, text: "游戏最强职业是啥"}
      - {speaker: B, text: "夜使者啊显然", emote: 3}
      - {speaker: A, text: "哈哈不可能。主教有用多了"}
      - {speaker: B, text: "有用是有用但夜使者伤害最高"}
      - {speaker: A, text: "随便吧哥们", emote: 1}
      - {speaker: B, text: "继续气哈哈", emote: 3}

  class_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "该建战士还是法师"}
      - {speaker: B, text: "看你想要啥。战士肉 法师大AOE"}
      - {speaker: A, text: "我想看起来酷"}
      - {speaker: B, text: "那就黑暗骑士哈哈", emote: 2}
      - {speaker: A, text: "成"}

  item_price_haggle:
    participants: 2
    lines:
      - {speaker: A, text: "那些飞镖多少钱？"}
      - {speaker: B, text: "一套450万"}
      - {speaker: A, text: "有点贵…350？"}
      - {speaker: B, text: "最低400万"}
      - {speaker: A, text: "成交", emote: 2}
      - {speaker: B, text: "交易我"}

  item_price_haggle_2:
    participants: 2
    lines:
      - {speaker: A, text: "出 10%手套攻击"}
      - {speaker: B, text: "多少"}
      - {speaker: A, text: "6000万"}
      - {speaker: B, text: "笑死不要谢", emote: 4}
      - {speaker: A, text: "好5000万最终价"}
      - {speaker: B, text: "不要 卖的好运吧"}

  quest_help:
    participants: 2
    lines:
      - {speaker: A, text: "知道蘑菇神社在哪吗？"}
      - {speaker: B, text: "知道 从天空之城坐船"}
      - {speaker: A, text: "有船？？", emote: 5}
      - {speaker: B, text: "哈哈对 天空之城塔顶。有售票处"}
      - {speaker: A, text: "哦哦好好谢谢谢谢", emote: 2}

  quest_help_2:
    participants: 2
    lines:
      - {speaker: A, text: "谁知道怎么去冰峰雪域？"}
      - {speaker: B, text: "去天空之城然后下塔"}
      - {speaker: A, text: "整座塔？？要多久"}
      - {speaker: B, text: "大概20层哈哈"}
      - {speaker: A, text: "兄弟", emote: 7}

  real_life_school:
    participants: 2
    lines:
      - {speaker: A, text: "唉明天有考试"}
      - {speaker: B, text: "其实一样。数学？"}
      - {speaker: A, text: "对。一点没复习", emote: 7}
      - {speaker: B, text: "哈哈一样。我们没事"}
      - {speaker: A, text: "一厢情愿哈哈"}

  real_life_food:
    participants: 2
    lines:
      - {speaker: A, text: "晚饭吃啥了"}
      - {speaker: B, text: "方便面哈哈"}
      - {speaker: A, text: "经典游戏人燃料", emote: 2}
      - {speaker: B, text: "不是自愿的相信我", emote: 4}

  real_life_late_night:
    participants: 2
    lines:
      - {speaker: A, text: "哥们凌晨三点了"}
      - {speaker: B, text: "然后呢？"}
      - {speaker: A, text: "明天不上学吗"}
      - {speaker: B, text: "上但再一趟"}
      - {speaker: A, text: "你一小时前也这么说哈哈", emote: 2}

  real_life_weather:
    participants: 2
    lines:
      - {speaker: A, text: "外面雨下得真大"}
      - {speaker: B, text: "完美天气待屋里玩冒险岛", emote: 0}
      - {speaker: A, text: "真的啊啊"}

  nostalgia_old_maple:
    participants: 2
    lines:
      - {speaker: A, text: "哥们记得射手村猎场人挤爆吗"}
      - {speaker: B, text: "好耶 大家抢频道", emote: 2}
      - {speaker: A, text: "然后有人抢你怪你就踩人气"}
      - {speaker: B, text: "笑死 人气战争。经典冒险岛"}
      - {speaker: A, text: "那日子啊", emote: 4}

  nostalgia_maple_island:
    participants: 2
    lines:
      - {speaker: A, text: "你记得枫叶岛吗"}
      - {speaker: B, text: "哥们当然。蜗牛"}
      - {speaker: A, text: "我记得死在蓝蜗牛上因为不会用药", emote: 7}
      - {speaker: B, text: "笑死那真惨", emote: 2}
      - {speaker: A, text: "我们都曾是萌新"}

  flex_compare:
    participants: 2
    lines:
      - {speaker: A, text: "看我新武器", emote: 3}
      - {speaker: B, text: "不错。花了多少"}
      - {speaker: A, text: "2亿"}
      - {speaker: B, text: "哥们我能给你搞到1.5亿的", emote: 5}
      - {speaker: A, text: "…别告诉我", emote: 4}

  flex_level:
    participants: 2
    lines:
      - {speaker: A, text: "今天刚到70！！", emote: 2}
      - {speaker: B, text: "不错恭喜！", emote: 2}
      - {speaker: A, text: "三转比二转爽多了"}
      - {speaker: B, text: "等你四转。完全新游戏"}
      - {speaker: A, text: "等不及"}

  afk_check:
    participants: 2
    lines:
      - {speaker: A, text: "你在吗？"}
      - {speaker: B, text: "在抱歉挂机了"}
      - {speaker: A, text: "哈哈没事以为你掉线了"}
      - {speaker: B, text: "没有就倒了杯水"}

  scam_warning:
    participants: 2
    lines:
      - {speaker: A, text: "哥们刚有人在自由市场想骗我"}
      - {speaker: B, text: "怎么了"}
      - {speaker: A, text: "他挂上白卷最后一秒换成10%卷"}
      - {speaker: B, text: "经典骗局。点交易前一定再看一眼", emote: 1}
      - {speaker: A, text: "对惨痛教训学到了", emote: 4}

  guild_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你有公会吗？"}
      - {speaker: B, text: "有 Resilience。挺活跃"}
      - {speaker: A, text: "他们招人吗？一直在找"}
      - {speaker: B, text: "有 密会长。说我介绍的"}
      - {speaker: A, text: "成谢啦！", emote: 2}

  boss_planning:
    participants: 2
    lines:
      - {speaker: A, text: "今晚打扎昆吗？"}
      - {speaker: B, text: "几点"}
      - {speaker: A, text: "大概美东8点？需要主教"}
      - {speaker: B, text: "我可以问公会人。他13x主教"}
      - {speaker: A, text: "完美搞起来", emote: 2}

  scroll_results:
    participants: 2
    lines:
      - {speaker: A, text: "我刚砸60%武器连续炸了5次", emote: 6}
      - {speaker: B, text: "哥们60%卷是谎言。感觉像30%"}
      - {speaker: A, text: "字面意思。2亿打水漂"}
      - {speaker: B, text: "F"}

  scroll_results_2:
    participants: 2
    lines:
      - {speaker: A, text: "我刚60%卷7/7全过", emote: 2}
      - {speaker: B, text: "不可能。举证", emote: 5}
      - {speaker: A, text: "认真的。手在抖"}
      - {speaker: B, text: "哥们去买彩票"}
      - {speaker: A, text: "笑死真的"}

  fashion_talk:
    participants: 2
    lines:
      - {speaker: A, text: "哟那套衣服哪来的"}
      - {speaker: B, text: "商城。刚花大概10刀点券"}
      - {speaker: A, text: "值了你看着新鲜", emote: 2}
      - {speaker: B, text: "谢谢。射手村得好看你懂", emote: 3}

  money_problems:
    participants: 2
    lines:
      - {speaker: A, text: "我好穷", emote: 4}
      - {speaker: B, text: "多穷"}
      - {speaker: A, text: "大概5万金币穷"}
      - {speaker: B, text: "哥们那真的啥也不是笑死", emote: 2}
      - {speaker: A, text: "我知道所以才是问题", emote: 7}

  pet_talk:
    participants: 2
    lines:
      - {speaker: A, text: "养宠值得吗？"}
      - {speaker: B, text: "百分百。自动捡改变人生"}
      - {speaker: A, text: "该买哪个"}
      - {speaker: B, text: "无所谓功能一样。买你觉得可爱的"}
      - {speaker: A, text: "那就哈士奇", emote: 0}

  maple_gf:
    participants: 2
    lines:
      - {speaker: A, text: "我冒险岛女友刚跟我分手", emote: 4}
      - {speaker: B, text: "哥们啥"}
      - {speaker: A, text: "她说找到更高等级的了"}
      - {speaker: B, text: "笑死好冷", emote: 2}
      - {speaker: A, text: "痛"}

  random_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "嘿"}
      - {speaker: B, text: "嘿"}
      - {speaker: A, text: "..."}
      - {speaker: B, text: "..."}
      - {speaker: A, text: "天气不错"}
      - {speaker: B, text: "哈哈"}

  coming_back:
    participants: 2
    lines:
      - {speaker: A, text: "三年后刚回冒险岛"}
      - {speaker: B, text: "欢迎回来！几级"}
      - {speaker: A, text: "52。感觉又是萌新哈哈"}
      - {speaker: B, text: "不会很快追上。现在升级容易多了"}
      - {speaker: A, text: "好消息", emote: 0}

  dc_frustration:
    participants: 2
    lines:
      - {speaker: A, text: "我刚boss半路掉线了", emote: 6}
      - {speaker: B, text: "RIP。丢点了吗？"}
      - {speaker: A, text: "对buff全没了"}
      - {speaker: B, text: "惨。这服最近卡死了"}
      - {speaker: A, text: "我心态崩了", emote: 1}

  fame_exchange:
    participants: 2
    lines:
      - {speaker: A, text: "人气换人气？"}
      - {speaker: B, text: "行"}
      - {speaker: A, text: "好我给你点了"}
      - {speaker: B, text: "回你了", emote: 2}
      - {speaker: A, text: "谢啦！"}

  job_advancement:
    participants: 2
    lines:
      - {speaker: A, text: "我要三转了！！", emote: 2}
      - {speaker: B, text: "不错！啥职业？"}
      - {speaker: A, text: "走游侠"}
      - {speaker: B, text: "扎实选择。侧移打得好疼"}
      - {speaker: A, text: "等不及试试"}

  server_drama:
    participants: 2
    lines:
      - {speaker: A, text: "听说昨天自由市场那戏了吗"}
      - {speaker: B, text: "没有咋了"}
      - {speaker: A, text: "有人被抓复制封号了"}
      - {speaker: B, text: "笑死好。复制毁经济"}
      - {speaker: A, text: "真的"}

  # ═══════════════════════════════════════
  #  三人对话
  # ═══════════════════════════════════════

  pq_planning:
    participants: 3
    lines:
      - {speaker: A, text: "有人打天空组队吗？"}
      - {speaker: B, text: "我愿意。你几级？"}
      - {speaker: A, text: "58主教"}
      - {speaker: C, text: "我也进。55隐士"}
      - {speaker: B, text: "完美。再找3个"}
      - {speaker: A, text: "天空之城2频见"}
      - {speaker: C, text: "在路上"}

  pq_planning_2:
    participants: 3
    lines:
      - {speaker: A, text: "组>废弃组队缺2"}
      - {speaker: B, text: "你几级"}
      - {speaker: A, text: "25刺客"}
      - {speaker: C, text: "我来。28牧师"}
      - {speaker: B, text: "好我也来。废弃见"}
      - {speaker: A, text: "冲啊", emote: 2}

  best_town_debate:
    participants: 3
    lines:
      - {speaker: A, text: "射手村是冒险岛最好城镇改变我想法"}
      - {speaker: B, text: "不魔法密林酷多了。音乐和树"}
      - {speaker: C, text: "废弃都市氛围最好。黑巷审美"}
      - {speaker: A, text: "哥们废弃字面是垃圾场哈哈", emote: 2}
      - {speaker: B, text: "他说得对。废弃有味"}
      - {speaker: C, text: "你们就是不懂欣赏", emote: 1}

  guild_drama:
    participants: 3
    lines:
      - {speaker: A, text: "哥们我们会长两周没上了"}
      - {speaker: B, text: "又？？上个月不也这样"}
      - {speaker: C, text: "这节点该自己建公会了"}
      - {speaker: A, text: "我就这意思。我有够金币建会"}
      - {speaker: B, text: "叫啥"}
      - {speaker: C, text: "酷点的。比如Oblivion之类"}
      - {speaker: A, text: "哈哈好想想"}

  someone_flexing:
    participants: 3
    lines:
      - {speaker: A, text: "哟哟哟我扭蛋出混沌卷了", emote: 2}
      - {speaker: B, text: "不可能", emote: 5}
      - {speaker: C, text: "没图没真相"}
      - {speaker: A, text: "字面在背包里看"}
      - {speaker: B, text: "哥们卖个1亿+"}
      - {speaker: C, text: "或者用了求欧", emote: 3}
      - {speaker: A, text: "我要用。yolo"}
      - {speaker: B, text: "你疯了", emote: 5}

  boss_fight_recap:
    participants: 3
    lines:
      - {speaker: A, text: "那趟扎昆好激烈"}
      - {speaker: B, text: "兄弟我差点死三次", emote: 7}
      - {speaker: C, text: "我死了。两次。哈哈", emote: 4}
      - {speaker: A, text: "至少掉头盔了"}
      - {speaker: B, text: "谁拿到？"}
      - {speaker: A, text: "我哈哈", emote: 3}
      - {speaker: C, text: "兄弟"}

  whos_strongest:
    participants: 3
    lines:
      - {speaker: A, text: "好谁这儿最强"}
      - {speaker: B, text: "我显然", emote: 3}
      - {speaker: C, text: "你字面60级冷静", emote: 2}
      - {speaker: B, text: "等级不是一切好吗"}
      - {speaker: A, text: "其实有点是"}
      - {speaker: C, text: "笑死"}

  late_night_group:
    participants: 3
    lines:
      - {speaker: A, text: "为啥凌晨四点全在线"}
      - {speaker: B, text: "因为没自制力"}
      - {speaker: C, text: "我字面7点上班", emote: 7}
      - {speaker: A, text: "那去睡？？"}
      - {speaker: C, text: "再一趟"}
      - {speaker: B, text: "这才对", emote: 2}

  training_recommendations:
    participants: 3
    lines:
      - {speaker: A, text: "嘿我35该去哪练"}
      - {speaker: B, text: "僵尸蘑菇不错"}
      - {speaker: C, text: "不打玩具组队快多了"}
      - {speaker: B, text: "玩具组队有队才好"}
      - {speaker: A, text: "我没队哈哈"}
      - {speaker: C, text: "我来。走"}
      - {speaker: A, text: "冲啊", emote: 2}

  real_life_group:
    participants: 3
    lines:
      - {speaker: A, text: "你们哪国人"}
      - {speaker: B, text: "美国。加州"}
      - {speaker: C, text: "加拿大"}
      - {speaker: A, text: "巴西！"}
      - {speaker: B, text: "酷。冒险岛真全球啊", emote: 2}
      - {speaker: C, text: "爱了"}

  two_argue_third_mediates:
    participants: 3
    lines:
      - {speaker: A, text: "战士打boss字面没用"}
      - {speaker: B, text: "抱歉？那谁给你抗", emote: 6}
      - {speaker: A, text: "吃药够快谁都能抗"}
      - {speaker: C, text: "好冷静。每职业有角色"}
      - {speaker: B, text: "谢谢。至少有人懂"}
      - {speaker: A, text: "好好吧。战士还行吧"}
      - {speaker: C, text: "这就对了", emote: 0}

  halloween_event:
    participants: 3
    lines:
      - {speaker: A, text: "你们做万圣节活动吗？"}
      - {speaker: B, text: "做 这次奖励其实不错"}
      - {speaker: C, text: "奖励啥？"}
      - {speaker: A, text: "有披风和椅子"}
      - {speaker: B, text: "披风属性也还行"}
      - {speaker: C, text: "好我进。任务哪开始"}
      - {speaker: A, text: "射手村公园找NPC"}

  # ═══════════════════════════════════════
  #  四人对话
  # ═══════════════════════════════════════

  party_formation:
    participants: 4
    lines:
      - {speaker: A, text: "好谁来打天空组队"}
      - {speaker: B, text: "我。57牧师"}
      - {speaker: C, text: "进。54游侠"}
      - {speaker: D, text: "62隐士在这"}
      - {speaker: A, text: "完美。最好再2个战士"}
      - {speaker: B, text: "问朋友他是黑骑"}
      - {speaker: D, text: "搞起来", emote: 2}

  group_reaction:
    participants: 4
    lines:
      - {speaker: A, text: "你们刚看见吗", emote: 5}
      - {speaker: B, text: "啥"}
      - {speaker: C, text: "看见啥？"}
      - {speaker: A, text: "有人刚掉白卷地上"}
      - {speaker: D, text: "笑死谁干这事", emote: 2}
      - {speaker: B, text: "意外？？"}
      - {speaker: C, text: "可能秀。或者意外哈哈"}
      - {speaker: A, text: "反正心脏停了一秒"}

  debate_2v2:
    participants: 4
    lines:
      - {speaker: A, text: "天空之城比玩具城强来打我"}
      - {speaker: B, text: "同意。天空音乐好太多"}
      - {speaker: C, text: "你们疯了？？玩具有组队有塔还有玩具工厂"}
      - {speaker: D, text: "对玩具明显更强。天空就是船停站", emote: 1}
      - {speaker: A, text: "船停站？？天空有花园和云公园！"}
      - {speaker: B, text: "天空组队也被低估"}
      - {speaker: C, text: "求同存异吧"}
      - {speaker: D, text: "但玩具赢", emote: 3}

  guild_meeting:
    participants: 4
    lines:
      - {speaker: A, text: "好公会开会。第一项"}
      - {speaker: B, text: "能谈扎昆排期吗"}
      - {speaker: A, text: "能。每周六美东8点。大家都要到"}
      - {speaker: C, text: "周六来不了呢？"}
      - {speaker: A, text: "周日补跑"}
      - {speaker: D, text: "我觉得公平"}
      - {speaker: B, text: "还能搞公会旗帜吗"}
      - {speaker: A, text: "我去看。散会哈哈", emote: 0}

  roast_session:
    participants: 4
    lines:
      - {speaker: A, text: "披风不错哥们"}
      - {speaker: B, text: "谢！", emote: 2}
      - {speaker: A, text: "我在阴阳", emote: 3}
      - {speaker: C, text: "笑死", emote: 2}
      - {speaker: B, text: "哇好", emote: 4}
