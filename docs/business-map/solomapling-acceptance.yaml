  to: beidou.identity.native-character
  summary: 白名单来源经北斗原生登录、创建、选角和频道进入取得普通角色。
- from: solo.acceptance.native-source
  type: writes
  to: beidou.identity.characters
  summary: 允许首次创建时由原生创建器建立专用普通角色，角色持久规则仍由北斗拥有。
- from: solo.acceptance.observe
  type: reads
  to: beidou.world.scene
  summary: 从原生角色实际地图和实例读取场景事实，不能按 map_id 替换实例。
- from: solo.acceptance.observe
  type: reads
  to: beidou.economy.inventory
  summary: 只读投影原生背包摘要，不维护第二份背包。
- from: solo.acceptance.observe
  type: reads
  to: beidou.economy.wallet
  summary: 只读投影原生金币及券摘要，不更改原生计价和余额规则。
- from: solo.acceptance.npc
  type: consumes
  to: beidou.quests.npc-dialogue
  summary: 经 EnterMTSHandler 与 NPCMoreTalkHandler 触发原生脚本，路径开放范围归验收策略。
- from: solo.acceptance.close
  type: reads
  to: beidou.identity.characters
  summary: 正常退出后读取原生角色持久字段验证声明范围的保存结果。
- from: solo.acceptance.close
  type: consumes
  to: beidou.identity.native-character
  summary: 角色正常退出与存档仍沿北斗 Client.disconnect 的原生生命周期。
flows:
- id: solo.acceptance.open.flow
  name: 专用角色打开
  summary: 白名单、普通原生登录与同壳模块就绪共同决定成功。
  scenario: solo.acceptance.open
  startsAt: accept
  steps:
  - id: accept
    kind: action
    name: 校验并恢复请求
    summary: 核管理员、profile、历史容量与原 request_id。
    concept: solo.acceptance.open
  - id: duplicate
    kind: decision
    name: 是否已有相同请求
    summary: 相同指纹返回原操作，冲突指纹直接拒绝。
    concept: solo.acceptance.idempotency
  - id: restore
    kind: outcome
    name: 恢复原操作或拒绝冲突
    summary: 不再次创建原生角色。
  - id: native
    kind: action
    name: 沿原生规则取得角色
    summary: 在 OPEN 前建立宿主，经原生账号登录、选角和频道进入。
    concept: solo.acceptance.native-source
  - id: ready
    kind: decision
    name: 来源绑定和模块是否均就绪
    summary: 创建成功本身不等于 OPEN；还需同壳读取当前角色和模块可用。
    concept: solo.runtime.bind-role
  - id: open
    kind: outcome
    name: 会话 OPEN
    summary: 发布 session、代次与原生角色身份。
  - id: cleanup
    kind: outcome
    name: 保留失败与清理证据
    summary: 按原根回滚；无法证实清理时保留 fixture 和 quarantine。
  transitions:
  - from: accept
    to: duplicate
  - from: duplicate
    to: restore
    when: 已记录相同请求或 ID 指纹冲突
  - from: duplicate
    to: native
    when: 新的合法请求
  - from: native
    to: ready
  - from: ready
    to: open
    when: 角色当前且绑定、模块和发布成功
  - from: ready
    to: cleanup
    when: 原生打开、绑定或模块接入失败或取消
- id: solo.acceptance.chat.flow
  name: 普通聊天原生验收
  summary: 受理、派发、广播证据和物理结算保持独立。
  scenario: solo.acceptance.chat
  startsAt: guard
  steps:
  - id: guard
    kind: action
    name: 校验会话与最近场景
    summary: 按原请求恢复历史，新请求才接纳宿主原 work。
    concept: solo.acceptance.chat
  - id: dispatch
    kind: action
    name: 唯一通道派发原生聊天
    summary: 出队再次检查上下文、编码、禁言和原生限频。
    concept: solo.runtime.dispatch-chat
  - id: evidence
    kind: decision
    name: 得到何种真实证据
    summary: 新匹配自身广播包证明成功，完整负证据与证据不全分别处理。
    concept: solo.runtime.action-result
  - id: success
    kind: outcome
    name: 广播已发生
    summary: 保留成功事实，后续取消不能撤回；额度仍等真实 work 结算。
  - id: failed
    kind: outcome
    name: 确认未广播或未派发
    summary: 完整负证据或派发前拒绝保留其固定结果。
  - id: unknown
    kind: outcome
    name: 结果未知且不自动重放
    summary: 派发后证据不足或异常不推断成功，也不再次发送。
  transitions:
  - from: guard
    to: dispatch
  - from: dispatch
    to: evidence
  - from: evidence
    to: success
    when: 有新匹配自身 CID 与原文的广播证据
  - from: evidence
    to: failed
    when: 派发前已拒绝或完整原生负证据
  - from: evidence
    to: unknown
    when: 已派发但证据不全或结果无法判定
- id: solo.acceptance.npc.flow
  name: 已审 NPC 回复
  summary: 先观察完整可信菜单，再以最新版本派发有限无收益回复。
  scenario: solo.acceptance.npc
  startsAt: observe
  steps:
  - id: observe
    kind: action
    name: 读取当前 CM 和最新版本
    summary: 固定原生中心入口或已审同步子对话提供来源。
    concept: solo.acceptance.observe
  - id: allowed
    kind: decision
    name: 回复是否完整且属于已审路径
    summary: 核最新包、同 CM、完整 offer 和 select/decline 白名单。
    concept: solo.acceptance.reply-rule
  - id: refused
    kind: outcome
    name: 拒绝未开放或过期回复
    summary: 不猜截断选项，不开放礼包 accept、目的地或任意脚本。
  - id: consume
    kind: action
    name: 消费该版并派发原生回复
    summary: 按真实 legacy/NextLevel 路由发有限回答或取消。
    concept: solo.acceptance.npc
  - id: result
    kind: decision
    name: 原生后态能否确认
    summary: 新包、路径、当前 CM 或正常清理共同决定结果。
  - id: verified
    kind: outcome
    name: 对话后态已确认
    summary: 返回新对话资格或已拒绝/取消结果。
  - id: uncertain
    kind: outcome
    name: 未知结果保留已消费状态
    summary: 不恢复旧版本或盲重发。
  transitions:
  - from: observe
    to: allowed
  - from: allowed
    to: refused
    when: 旧版、菜单不完整、路径未审或参数不符
  - from: allowed
    to: consume
    when: 最新完整 offer 且命中已审路径
  - from: consume
    to: result
  - from: result
    to: verified
    when: 实际新包与原生后态一致
  - from: result
    to: uncertain
    when: 证据不全或后态无法确认
- id: solo.acceptance.close.flow
  name: 保存退出与会话结束
  summary: 关闭需要原生清理、声明范围存档和真实排空全部通过。
  scenario: solo.acceptance.close
  startsAt: begin
  steps:
  - id: begin
    kind: action
    name: 请求根宿主关闭
    summary: 停止输入并取消未派发动作，已受理关闭继续完成清理。
    concept: solo.runtime.close-role
  - id: cleanup
    kind: action
    name: 执行来源退出并核存档
    summary: 正常退出队伍/事件、disconnect 并核 CM/QM 和声明持久字段。
    concept: solo.acceptance.close
  - id: verified
    kind: decision
    name: 释放与全部结算是否都已证实
    summary: operation 终态或 Future 完成不能代替实际排空。
    concept: solo.runtime.true-settlement
  - id: closed
    kind: outcome
    name: 会话关闭且 fixture 保留
    summary: 释放 profile 与 lease，原角色数据继续保留用于重开。
  - id: pending
    kind: outcome
    name: 保留关闭中或 quarantine
    summary: 仍有工作则等待；原生清理/存档未核验则保留失败债务。
  transitions:
  - from: begin
    to: cleanup
  - from: cleanup
    to: verified
  - from: verified
    to: closed
    when: 原生与存档核验成功且所有工作真实结算
  - from: verified
    to: pending
    when: 执行未结束或清理、存档、释放证据不足
