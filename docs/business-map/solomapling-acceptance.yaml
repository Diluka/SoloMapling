schemaVersion: 1
map:
  id: solo.acceptance
  title: SoloMapling：MCP 游戏验收
  summary: 专用普通角色的受控观察、原生聊天与已审 NPC 验收；源码接线与实际部署能力分别确认。
nodes:
- id: solo.acceptance
  kind: domain
  name: MCP 游戏验收
  summary: 让授权管理员观察世界并用白名单专用普通角色进行受控原生验收；七工具及开放动作以运行时 capabilities 为准。
  aliases:
  - 验收桥
  - solo_acceptance
  - R2a
  anchors:
  - kind: file
    value: docs/mcp-acceptance/README.md
    description: 让授权管理员观察世界并用白名单专用普通角色进行受控原生验收；七工具及开放动作以运行时 capabilities 为准。
- id: solo.acceptance.protocol
  kind: interface
  name: 七工具验收协议
  summary: 提供 capabilities、observe、actor_open、actor_close、operation_get、operation_cancel、game_act；角色密码与任意 CID 不进入工具参数。
  aliases: []
  anchors:
  - kind: symbol
    file: tools/acceptance-mcp/src/solo_acceptance_mcp/server.py
    value: build_server
    description: 构建受能力过滤的 MCP 工具服务，桥接到有鉴权的本地验收接口。
- id: solo.acceptance.discover
  kind: scenario
  name: 观察已加载世界与场景
  summary: 先枚举已加载地图与被在线成员引用的实例，再凭实际 scene_ref 查询场景；不为观察创建地图或副本。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/AcceptanceObservationService.java
    value: AcceptanceObservationService.observe
    description: 按 world 或 scene 范围返回当前代次的真实已加载对象快照，旧引用拒绝。
- id: solo.acceptance.open
  kind: scenario
  name: 打开专用原生验收角色
  summary: 通过配置 profile 解析普通账号与角色，沿北斗登录和频道进入规则创建或重登；同一宿主绑定且控制模块可用才确认 OPEN。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.runOpen
    description: 在根已接纳 OPEN work 内打开角色、绑定来源和模块，成功发布前检查取消及会话当前性。
- id: solo.acceptance.observe
  kind: operation
  name: 观察本会话角色与包事件
  summary: 核验 owner、session、代次和真实在线对象，从同一宿主来源读取角色事实及独立包窗口；观察不新增操作历史。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.observe
    description: 在读取前后复核会话和在线对象，只向合法活会话返回角色与包正文。
- id: solo.acceptance.chat
  kind: scenario
  name: 通过原生普通聊天发言
  summary: 按真实 session 与最近场景快照受理普通文本，模块复用共享 Java 动作；只有新匹配自身原文广播包才确认成功。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.submitChat
    description: 将同一宿主原 work、MCP 场景守卫与聊天取证适配交给共享动作，按真实 work 结算退款。
- id: solo.acceptance.npc
  kind: scenario
  name: 进行已审无收益 NPC 对话
  summary: 固定原生脚本中心入口，按完整 offer、已审路径和最新版本选择、拒绝或取消；未开放礼包 accept、任意 NPC 和完整出行。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/NativeActorBackend.java
    value: NativeActorBackend.npcReply
    description: 派发已审 select 或 decline，按新 NPC 包、原生 CM 与来源路径确认结果。
- id: solo.acceptance.close
  kind: scenario
  name: 正常退出并核验存档
  summary: 由根宿主结束模块并按原来源关闭，核原生地图/队伍/事件/CM/QM 清理与声明范围持久字段；失败保留 fixture 与 quarantine。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/NativeActorBackend.java
    value: NativeActorBackend.close
    description: 沿原生合作退出和 disconnect 清理，读取数据库核声明范围存档后给出释放证明。
- id: solo.acceptance.cancel
  kind: operation
  name: 请求取消未完成操作
  summary: 按原操作和请求 ID 请求取消；取消待派发任务不关闭角色，已经广播不声称撤回，已接受关闭继续清理。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.cancel
    description: 校验操作所有者并记录取消请求，保留真实执行与取消之间的区别。
- id: solo.acceptance.poll
  kind: operation
  name: 查询异步操作事实
  summary: 按原 operation ID 查询受理、排队、派发、结果与生命周期事件；超时后恢复原操作，不盲目重放副作用。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.get
    description: 读取所属操作的有界事件窗口与当前结果。
- id: solo.acceptance.native-source
  kind: operation
  name: 按白名单取得普通原生角色
  summary: profile 只绑定专用 mcp_ 普通账号，沿原生账号登录、角色创建、选角和频道进入，保留租约且排除环境 Bot。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/NativeActorBackend.java
    value: NativeActorBackend.openOwned
    description: 执行账号/角色白名单校验及原生登录链，在根来源握手下接纳精确角色结果。
- id: solo.acceptance.profiles
  kind: data
  name: 本地角色 profile 白名单
  summary: 配置约束账号、密码、角色名、固定世界/频道与首次创建许可；工具仅接受 profile ID，密钥不作为地图内容。
  aliases:
  - actor-profiles
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorProfiles.java
    description: 配置约束账号、密码、角色名、固定世界/频道与首次创建许可；工具仅接受 profile ID，密钥不作为地图内容。
- id: solo.acceptance.sessions
  kind: data
  name: 验收角色会话
  summary: 记录 owner、profile、session_generation、捕获世界来源和同一 CharacterRuntime 关联；不复制宿主根资源或角色档案。
  aliases:
  - session
  - runtime_generation
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    description: 记录 owner、profile、session_generation、捕获世界来源和同一 CharacterRuntime 关联；不复制宿主根资源或角色档案。
- id: solo.acceptance.operations
  kind: data
  name: 请求幂等与异步操作历史
  summary: 进程内保留请求身份与参数指纹、operation 结果和事件；容量满明确拒绝并为首次关闭预留额度。
  aliases:
  - request_id
  - operation_id
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    description: 进程内保留请求身份与参数指纹、operation 结果和事件；容量满明确拒绝并为首次关闭预留额度。
- id: solo.acceptance.packets
  kind: data
  name: 角色原生包事件窗口
  summary: 根 AcceptanceClient 持有最多 256 包的独立序号窗口，已知正文有界解码；过期、截断和未来游标明确处理。
  aliases:
  - since_cursor
  - packet sequence
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/org/gms/soloacceptance/actor/PacketEventBuffer.java
    description: 根 AcceptanceClient 持有最多 256 包的独立序号窗口，已知正文有界解码；过期、截断和未来游标明确处理。
- id: solo.acceptance.dialogue
  kind: data
  name: 当前可信对话版本与选项
  summary: 对话资格关联最新 NPC 包、同一活跃 CM、已审来源和完整选项；未知坏包或派发消费使旧资格失效。
  aliases:
  - dialogue_version
  - offer
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/org/gms/soloacceptance/actor/NativeDialogueTracker.java
    description: 对话资格关联最新 NPC 包、同一活跃 CM、已审来源和完整选项；未知坏包或派发消费使旧资格失效。
- id: solo.acceptance.quarantine
  kind: data
  name: 未核验关闭与保留 fixture
  summary: 原生创建/清理不确定时保留角色资料、资源债务和恢复关联，不自动删除账号或宣称 CLOSED。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.runClose
    description: 清理未核验时将会话保留为 QUARANTINED 并保存固定失败事实。
- id: solo.acceptance.admin
  kind: invariant
  name: 管理身份与会话所有权
  summary: 沿正常管理端 JWT 验证 ROLE_ADMIN，再按 owner 约束每个 session 和 operation；可观察不等于可接管任意角色。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/AcceptanceAccess.java
    value: AcceptanceAccess.requireAdmin
    description: 从原生 Spring Security 上下文要求已认证管理员身份。
- id: solo.acceptance.idempotency
  kind: invariant
  name: 相同请求恢复相同事实
  summary: 同作用域 request_id 的相同指纹复用原 operation，参数冲突拒绝；不遗忘历史腾容量，重启不承诺旧幂等。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.duplicate
    description: 按 kind、owner、target、request_id 校验请求指纹并恢复已记录操作。
- id: solo.acceptance.context
  kind: invariant
  name: 外层会话与实际场景双重守卫
  summary: 动作受理和出队均核 owner、会话/世界代次与 expected_context；runtime_generation 始终表示世界代次。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/ActorControlService.java
    value: ActorControlService.validateActionContext
    description: 凭实际角色来源比对最近场景引用，不能以同 map_id 替代真实实例。
- id: solo.acceptance.reply-rule
  kind: invariant
  name: 只回答最新完整且已审的对话
  summary: select 必须来自该版完整 offer 且命中已审路径；decline 仅已审福利确认，派发前消费版本，未知副作用不恢复资格。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/org/gms/soloacceptance/actor/AcceptanceClient.java
    value: AcceptanceClient.validateNativeDialogueReply
    description: 逐项核最新版本、完整菜单和路径白名单，拒绝未开放收益或出行选择。
