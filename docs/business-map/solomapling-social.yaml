flows:
- id: solo.social.choose-reply.flow
  name: 自由文本回复及回退
  summary: 区分组队、告别、静态选项和自由文本；模型失败按配置回退，旧会话结果不应用。
  scenario: solo.social.choose-reply
  startsAt: choose
  steps:
  - id: choose
    kind: decision
    name: 玩家输入属于哪条对话路径
    summary: 组队与告别先独立处理，其他已知静态选项或未启用模型走 YAML，剩余自由文本才请求模型。
  - id: yaml
    kind: action
    name: 使用静态文案
    summary: 读取静态分类和本地化回退。
    concept: solo.social.yaml-reply
  - id: model
    kind: action
    name: 请求模型
    summary: 按配置限制和超时等待外部回复。
    concept: solo.social.llm-reply
  - id: current
    kind: decision
    name: 会话轮次是否仍有效
    summary: 模型返回及表现执行时核对当前玩家和修订。
    concept: solo.social.current-turn-rule
  - id: discarded
    kind: outcome
    name: 迟到结果被丢弃
    summary: 不向已结束或更换玩家的会话应用答复。
  - id: result
    kind: decision
    name: 模型是否有效返回
    summary: 空白、异常和超时属于失败。
  - id: fallback
    kind: decision
    name: 是否启用静态回退
    summary: 配置决定失败后的用户结果。
  - id: menu
    kind: outcome
    name: 重新等待玩家选择
    summary: 不开启回退时只恢复选择状态。
  - id: speak
    kind: action
    name: 广播有效文案
    summary: 旧 V1 直接广播路径。
    concept: solo.social.broadcast
  - id: waiting
    kind: outcome
    name: 回复后继续等待选择
    summary: 当前会话仍可继续或稍后超时结束。
  - id: recruit
    kind: action
    name: 判断招募意愿
    summary: 共享招募规则决定承诺或拒绝，承诺后仍需玩家发送匹配队伍邀请。
    concept: solo.companions.assess-recruit
  - id: recruit-result
    kind: outcome
    name: 招募意愿已答复
    summary: 招募承诺与实际入队分开，接受/拒绝及窗口由伙伴域继续解释。
  - id: goodbye
    kind: action
    name: 告别并结束会话
    summary: 发送告别后重置交互者、历史与会话修订。
    concept: solo.social.end-conversation
  - id: ended
    kind: outcome
    name: 当前会话结束
    summary: 后续旧轮次模型结果不再应用。
  transitions:
  - from: choose
    to: model
    when: 非组队非告别的未知文本且模型已启用
  - from: choose
    to: yaml
    when: 已知静态分类或其他文本但模型未启用
  - from: yaml
    to: speak
  - from: model
    to: current
  - from: current
    to: discarded
    when: 玩家或修订已失效
  - from: current
    to: result
    when: 仍属当前会话
  - from: result
    to: speak
    when: 有效非空回复
  - from: result
    to: fallback
    when: 失败、空答复或超时
  - from: fallback
    to: yaml
    when: 启用 YAML 回退
  - from: fallback
    to: menu
    when: 未启用 YAML 回退
  - from: speak
    to: waiting
  - from: choose
    to: recruit
    when: 组队选项
  - from: choose
    to: goodbye
    when: 告别选项
  - from: recruit
    to: recruit-result
  - from: goodbye
    to: ended
