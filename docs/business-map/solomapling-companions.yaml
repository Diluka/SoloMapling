schemaVersion: 1
map:
  id: solo.companions
  title: Solo 伙伴协作与训练
  summary: V1 环境角色招募、组队、跟随、驻点与训练，以及明确未完成的 OPQ 原型边界。
nodes:
- id: solo.companions
  kind: domain
  name: Solo 伙伴协作与训练
  summary: 管理 V1 环境角色从招募、组队、跟随、驻点训练到结束协作的运行期行为；原生角色成长规则仍归北斗，当前不承诺持久伙伴或 V2 自治模块。
  aliases:
  - FollowerBot
  - TrainingBot
  - 伙伴
  - 练级
  anchors:
  - kind: document
    value: README.md
    description: 区分既有机器人代码、持久伙伴待验范围和未完成的通用 PQ。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/FollowerBot.java
    value: FollowerBot.updateState
    description: 监督跟随状态、队伍关系与交易暂停。
- id: solo.companions.recruit
  kind: scenario
  name: 招募环境机器人协作
  summary: 玩家经对话提出组队意愿，机器人按资格、容量和概率决定是否同意，再等待匹配玩家的原生邀请；口头同意不等于已入队。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotRecruitManager.java
    value: BotRecruitManager.rollPartyAsk
    description: 决定招募答复并记录邀请者与拒绝冷却。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.optPartyAsk
    description: 把训练机器人菜单选择交给招募规则。
- id: solo.companions.assess-recruit
  kind: operation
  name: 决定招募意愿
  summary: 低于 10 级、拒绝冷却中或需转跟随且数量达上限时拒绝；其余按调用方传入的概率答复，并保留同意邀请者。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotRecruitManager.java
    value: BotRecruitManager.rollPartyAsk
    description: 核对等级、冷却、跟随容量并作概率答复。
- id: solo.companions.join-party
  kind: operation
  name: 答复匹配的队伍邀请
  summary: 仅对已同意邀请者的邀请尝试正常答复和加入北斗队伍；过期、解散、已满或已在队伍时可失败，其他邀请被拒绝。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotRecruitManager.java
    value: BotRecruitManager.pollInvites
    description: 将实际邀请者与已同意对象匹配。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotPartyCommands.java
    value: BotPartyCommands.botAcceptPartyInvite
    description: 先答复 InviteCoordinator，再由 Party.joinParty 决定是否真正加入。
- id: solo.companions.recruitment-state
  kind: data
  name: 运行期招募与交接意图
  summary: 保存已同意邀请者、逐玩家拒绝冷却、待接管领队及驻点标记；这是进程内协调状态，不是持久伙伴存档。
  aliases: []
  anchors:
  - kind: file
    value: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotRecruitManager.java
    description: ARMED、DECLINED_UNTIL、PENDING_LEADER 与 PENDING_STATION 的唯一声明。
- id: solo.companions.recruitment-rules
  kind: invariant
  name: 招募承诺与实际入队分开
  summary: 普通招募必须遵守等级门槛、拒绝冷却和适用的跟随数量限制，并由原生队伍结果确认加入。isArmed 的时间窗口主要用于行为节奏；pollInvites 按已同意邀请者匹配，实际过期由原生协调器裁决。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotRecruitManager.java
    value: BotRecruitManager.pollInvites
    description: 确认邀请匹配与原生过期边界，不把同意窗口当唯一加入判断。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotPartySystem/BotPartyCommands.java
    value: BotPartyCommands.botAcceptPartyInvite
    description: 原生队伍加入失败仍返回失败。
- id: solo.companions.follow
  kind: operation
  name: 持续跟随指定真人
  summary: 以领队 ID 重新解析在线对象；同图追随、跨图规划追赶；交易时停止移动，领队短暂离线时等待重连。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/FollowerBot.java
    value: FollowerBot.doFollow
    description: 重新解析领队、检测退队并重新启动跟随。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/GCFollow.java
    value: GCFollow.tick
    description: 同图跟随或跨图行进，并在目标换图时改道。
- id: solo.companions.station
  kind: scenario
  name: 领队要求在当前地图训练
  summary: 只有当前领队可将跟随者转换为驻点训练，当前地图必须存在怪物索引；其他玩家或无怪地图的请求被拒绝。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/FollowerBot.java
    value: FollowerBot.onMenuSelect
    description: 校验请求者与地图后交接为 TrainingBot。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.doDecide
    description: 消费驻点交接标记并优先保留当前训练地图。
- id: solo.companions.end-follow
  kind: operation
  name: 结束跟随并回归环境活动
  summary: 退队、解散或领队失联超过宽限期时结束跟随；有怪地图转训练，城镇转社交，停止旧跟随并清除招募状态。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/FollowerBot.java
    value: FollowerBot.doLeaderLost
    description: 等待重连，宽限结束或退队后回退。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/FollowerBot.java
    value: FollowerBot.fallbackConvert
    description: 停止跟随并按地图转换训练或社交类型。
- id: solo.companions.train
  kind: scenario
  name: 按地图条件推进训练
  summary: V1 训练机器人选择地点、行进、练级和休息；与真人组队时优先其地图。可见地图使用实际攻击路径，无人观察时采用抽象经验增长，不能据此声称完成客户端玩法验收。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.updateState
    description: 驱动城镇、行进、训练与休息阶段。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.doGrind
    description: 区分可见战斗与无人观察的经验推进。
- id: solo.companions.choose-training-map
  kind: operation
  name: 选择并预约训练地图
  summary: 优先驻点与真人队伍目标，否则按等级、可达性、地图容量及拥挤冷却加权选图并预约；无合格地点时回城等待。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.doDecide
    description: 决定驻点、组队目标或自主选图。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotGrindSystem/TrainingMapChooser.java
    value: TrainingMapChooser.choose
    description: 筛选可达地图、按等级和容量选择并记录预约。
- id: solo.companions.training-state
  kind: data
  name: 训练阶段与地图预约
  summary: 记录训练阶段、当前训练目标、地图占用预约、休息与行进状态；离开训练、转换类型或停用时应释放相应运行期占用。
  aliases: []
  anchors:
  - kind: file
    value: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    description: 训练阶段、目标、计时与休息状态。
  - kind: file
    value: src/main/java/soloMapling/ArtificialPlayer/BotGrindSystem/TrainingMapChooser.java
    description: 训练地图预约与容量记录。
- id: solo.companions.navigate
  kind: operation
  name: 沿地图路径前往目标
  summary: 跟随及训练使用 GC 移动与跨图路径；行进完成或失败通过回调确认，无进展超时时取消并重新决策；旧 V1 代码不能据此视为已接入统一 V2 运行体。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.doTravel
    description: 按真实行进结果与进展超时切换训练阶段。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/GCMovement.java
    value: GCMovement.travel
    description: 启动既有 V1 跨图行进。
- id: solo.companions.attack
  kind: operation
  name: 执行 V1 可见战斗
  summary: 按职业和武器配置选取可达目标与攻击，遵守普通冷却；广播攻击后直接应用怪物伤害与机器人掉落适配，未走玩家完整 applyAttack 路径。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotAttackSystem/BotAttackDriver.java
    value: BotAttackDriver.botAttack
    description: 使用普通冷却控制的自动攻击。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotAttackSystem/BotAttackEffects.java
    value: BotAttackEffects.broadcastAndApply
    description: 广播攻击表现，再应用伤害和专用掉落路径。
- id: solo.companions.abstract-growth
  kind: operation
  name: 推进无人观察时的抽象经验
  summary: 仅在训练地图无人观察时，按经过时间和地图怪物等级直接更新机器人对象的经验及等级，并发布升级事件；这不同于一次真实击杀或持久伙伴成长验收。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.accrueAbstractExp
    description: 计算时间经验并修改本角色对象的等级和经验。
- id: solo.companions.remove-loot
  kind: operation
  name: 移除训练范围内可收集掉落
  summary: V1 训练按脚边距离或行走范围挑选归自己或已开放的掉落，然后从地图移除；当前 botLootSingleDrop 不向机器人背包入账，不能当作原生拾取获益或 PQ 交付。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotGrindSystem/GrindLoot.java
    value: GrindLoot.grabLootAtFeet
    description: 按距离与节奏选择脚边掉落。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotCommandsPack/DropCommands.java
    value: DropCommands.botLootSingleDrop
    description: 调用地图移除掉落，不执行背包获得。
- id: solo.companions.stop-training
  kind: operation
  name: 释放旧训练行为
  summary: 转换类型或停用时停止训练、取消桑拿延时回调、释放地图及站位预约、清除攻击与增益状态并停用移动，防止旧回调继续迁移角色。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBot.java
    value: TrainingBot.stopScheduledTask
    description: 清理旧训练的行为、预约、回调与移动状态。
  - kind: file
    value: beidou-integration/src/test/java/soloMapling/ArtificialPlayer/BotTypes/TrainingBotSaunaLifecycleTest.java
    description: 验证停用后迟到的桑拿回调不再发起换图或行进。
- id: solo.companions.opq-prototype
  kind: capability
  name: 旧 OPQ 两段协作原型
  summary: 保留云与唱片两段的目标分配、导航和局部计数原型；全局协调器、机关与物品语义存在已记录差异，不表示北斗完整女神之塔或通用 PQ 已实现。
  aliases:
  - 女神之塔原型
  - OrbisPQ prototype
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/OPQ/OPQOrchestrator.java
    value: OPQOrchestrator.assignCloudReactor
    description: 为旧原型分配未认领云目标。
  - kind: document
    value: docs/party-quests/OPQ-AUDIT.md
    description: 记录原型与北斗完整任务的规则、实例和物品契约差异。
  - kind: document
    value: docs/party-quests/README.md
    description: 区分现有原型与后续通用协作 PQ 设计。
