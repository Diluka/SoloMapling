  type: writes
  to: beidou.identity.characters
  summary: 直接更新当前机器人 Character 对象的等级和经验；不声称已经完成数据库持久化。
- from: solo.companions.station
  type: invokes
  to: solo.companions.train
  summary: 领队的合法驻点请求通过类型交接进入训练生命周期。
flows:
- id: solo.companions.recruit.flow
  name: 普通招募从同意到实际入队
  summary: 区分机器人答复、真实邀请匹配和原生入队成功。
  scenario: solo.companions.recruit
  startsAt: ask
  steps:
  - id: ask
    kind: action
    name: 玩家提出协作请求
    summary: 通过社交或训练菜单请求协作。
    concept: solo.companions.recruit
  - id: assess
    kind: decision
    name: 机器人是否同意
    summary: 核等级、拒绝冷却、适用容量并进行概率判断。
    concept: solo.companions.assess-recruit
  - id: declined
    kind: outcome
    name: 本次未同意
    summary: 资格、容量、冷却或概率导致本次拒绝，不加入队伍。
  - id: invite
    kind: decision
    name: 收到的邀请是否匹配
    summary: 未到达邀请时仍等待；到达后只接受已同意的邀请者。
    concept: solo.companions.join-party
  - id: mismatch
    kind: outcome
    name: 邀请被拒绝
    summary: 其他玩家的邀请被正常拒绝。
  - id: join
    kind: action
    name: 答复并尝试加入原生队伍
    summary: 消费实际邀请，再调用北斗队伍加入规则。
    concept: solo.companions.join-party
  - id: joined-check
    kind: decision
    name: 实际加入是否成功
    summary: 原生邀请可能过期，队伍可能已满、解散或角色已入队。
    concept: solo.companions.join-party
  - id: joined
    kind: outcome
    name: 实际加入队伍
    summary: 原生加入成功，后续社交转跟随或训练继续由各类型决定。
  - id: not-joined
    kind: outcome
    name: 仍未加入队伍
    summary: 邀请无效或原生入队失败，保留失败结果，不能以同意答复冒充成功。
  transitions:
  - from: ask
    to: assess
  - from: assess
    to: declined
    when: 拒绝或不满足条件
  - from: assess
    to: invite
    when: 同意并记录邀请者
  - from: invite
    to: mismatch
    when: 到达其他玩家的邀请
  - from: invite
    to: join
    when: 到达匹配玩家的邀请
  - from: join
    to: joined-check
  - from: joined-check
    to: joined
    when: 实际加入成功
  - from: joined-check
    to: not-joined
    when: 邀请或加入失败
- id: solo.companions.train.flow
  name: 推进一个 V1 训练周期
  summary: 在地点、行进和地图可见条件下区分真实战斗与抽象经验，不推导整场训练或持久化已完成。
  scenario: solo.companions.train
  startsAt: choose
  steps:
  - id: choose
    kind: action
    name: 决定训练目标
    summary: 优先驻点和真人队伍，否则筛选可达地图并预约。
    concept: solo.companions.choose-training-map
  - id: target
    kind: decision
    name: 是否找到训练目标
    summary: 自主筛选可能没有合格地点。
    concept: solo.companions.choose-training-map
  - id: idle
    kind: outcome
    name: 留在城镇等待
    summary: 没有合格训练地图，本轮不训练。
  - id: travel
    kind: action
    name: 行进或确认已经到达
    summary: 同图直接进入训练，跨图等待真实行进结果。
    concept: solo.companions.navigate
  - id: arrival
    kind: decision
    name: 是否到达训练地图
    summary: 行进可失败或在长期无进展时被取消。
    concept: solo.companions.navigate
  - id: replan
    kind: outcome
    name: 结束行进并重新决策
    summary: 不把行进失败视为已经训练。
  - id: observed
    kind: decision
    name: 当前地图是否有人观察
    summary: 可见性决定本轮经验推进与表现路径。
    concept: solo.companions.train
  - id: attack
    kind: action
    name: 执行可见战斗
    summary: 调用 V1 战斗；无合格目标或普通冷却时可以不出手。
    concept: solo.companions.attack
  - id: abstract
    kind: action
    name: 按时间推进经验
    summary: 无人观察时直接更新机器人对象的抽象等级经验。
    concept: solo.companions.abstract-growth
  - id: loot
    kind: action
    name: 按范围尝试清理掉落
    summary: 既有训练行为按距离与归属移除可收集掉落，不代表物品已进入背包。
    concept: solo.companions.remove-loot
  - id: progress
    kind: outcome
    name: 本轮训练已推进
    summary: 角色继续训练、休息或回城由后续阶段判断；不保证每轮必定击杀。
  transitions:
  - from: choose
    to: target
  - from: target
    to: idle
    when: 没有可用地图
  - from: target
    to: travel
    when: 有目标地图
  - from: travel
    to: arrival
  - from: arrival
    to: replan
    when: 失败或无进展超时
  - from: arrival
    to: observed
    when: 到达或已在目标地图
  - from: observed
    to: attack
    when: 地图被观察
  - from: observed
    to: abstract
    when: 地图无人观察
  - from: attack
    to: loot
  - from: abstract
    to: progress
  - from: loot
    to: progress
