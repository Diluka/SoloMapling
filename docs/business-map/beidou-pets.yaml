flows:
- id: beidou.pets.feed.flow
  name: 普通食物喂养宠物
  summary: 合法喂食消耗食物，但亲密收益取决于原先饱食度，满饱再喂反而降低亲密。
  scenario: beidou.pets.feed
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 提交食物槽和物品ID
    summary: 请求沿PetFoodHandler进入。
    concept: beidou.pets.feed
  - id: eligible
    kind: decision
    name: 原生喂食条件是否通过
    summary: 检查500毫秒原生限频、在场宠物、真实食物槽、212类ID和数量。
    concept: beidou.pets.feed
  - id: refused
    kind: outcome
    name: 拒绝本次喂食
    summary: 不满足条件时不更新宠物或消耗本次食物。
  - id: fullness
    kind: decision
    name: 当前宠物处于哪种饱食状态
    summary: 选取原生算法判定的最低饱食度宠物，按喂食前状态决定效果。
    concept: beidou.pets.records
  - id: hungry
    kind: outcome
    name: 补饱并增加亲密
    summary: 饱食度不超过75时加1亲密并补30饱食，按上限和等级阈值保存；扣一份食物。
    concept: beidou.pets.feed
  - id: partly-full
    kind: outcome
    name: 补饱但不增加亲密
    summary: 饱食度76到99时补30饱食并钳至100；不增亲密，扣一份食物。
    concept: beidou.pets.feed
  - id: overfed
    kind: outcome
    name: 满饱再喂降低亲密
    summary: 原生满饱分支扣1亲密，必要时降级，食物仍扣一份。
    concept: beidou.pets.feed
  transitions:
  - from: request
    to: eligible
  - from: eligible
    to: refused
    when: 频率、宠物或食物条件不满足
  - from: eligible
    to: fullness
    when: 喂食条件通过
  - from: fullness
    to: hungry
    when: 饱食度不超过75
  - from: fullness
    to: partly-full
    when: 饱食度76到99
  - from: fullness
    to: overfed
    when: 饱食度为100
