schemaVersion: 1
map:
  id: beidou-pets
  title: 北斗：原生宠物
  summary: 固定上游北斗1.12的宠物生命周期、成长、拾取辅助和补药入口。
nodes:
- id: beidou.pets
  kind: domain
  name: 北斗原生宠物
  summary: 上游北斗拥有宠物召唤、饥饿、亲密成长、指令和宠物辅助动作规则；宠物物品及食物药品的背包归属仍属经济域。
  aliases:
  - 宠物
  - pet
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    description: 原生宠物状态、成长规则与持久化入口。
- id: beidou.pets.records
  kind: data
  name: 宠物记录与在场状态
  summary: 宠物唯一ID、名称、等级、亲密度、饱食度、召唤标志与属性持久化到pets；地图位置、姿态与角色宠物槽描述当前在场状态。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    description: 宠物记录、地图状态和属性定义。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    value: Pet.createPet
    description: 创建宠物初始记录。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    value: Pet.loadFromDb
    description: 按宠物ID加载受上限约束的状态。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    value: Pet.saveToDb
    description: 保存名称、等级、亲密、饱食度、召唤和属性。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    value: Pet.deleteFromDb
    description: 删除宠物关联数据并清理过滤缓存。
- id: beidou.pets.summon
  kind: scenario
  name: 孵化、召唤与收回宠物
  summary: 从CASH背包物品取得宠物；龙蛋/机器人蛋按已有幼体限制孵化，普通宠物按当前召唤状态切换；召唤加载过滤列表并登记饥饿，收回保存状态并取消饥饿登记。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/processor/action/SpawnPetProcessor.java
    value: SpawnPetProcessor.processSpawnPet
    description: 按背包槽、蛋种、已有召唤和多宠技能决定孵化或召唤/收回。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.unEquipPet
    description: 保存非召唤状态、移除角色宠物槽并取消饥饿登记。
- id: beidou.pets.feed
  kind: scenario
  name: 喂食并更新亲密成长
  summary: 500毫秒原生限频后选择饱食度最低的在场宠物，核验真实食物槽和数量；饱食度不超过75时普通食物增加亲密，满饱再喂会降低亲密并可能降级。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetFoodHandler.java
    value: PetFoodHandler.handlePacket
    description: 核验限频、在场宠物和212类食物后更新宠物并扣食物。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/inventory/Pet.java
    value: Pet.gainTamenessFullness
    description: 统一钳制饱食度和亲密，按阈值升级或因满饱喂食降低亲密并持久化。
- id: beidou.pets.hunger
  kind: operation
  name: 随在线时间消耗饱食度
  summary: 世界按配置调度已登记宠物；饱食下降至不超过5时将其饱食重置为15并收回，否则保存新饱食度；全局或GM不饿配置可跳过登记。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/World.java
    value: World.registerPetHunger
    description: 根据全局与GM配置决定是否登记宠物饥饿。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/World.java
    value: World.runPetSchedule
    description: 对已在线角色按配置节拍触发宠物饱食更新。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.runFullnessSchedule
    description: 按物种饥饿值扣饱食，并保存或收回过饿宠物。
- id: beidou.pets.command
  kind: operation
  name: 向自己的在场宠物下达指令
  summary: 指令必须对应角色当前宠物和该物种已定义命令；按命令概率产生成功或失败响应，成功按命令值更新亲密成长。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetCommandHandler.java
    value: PetCommandHandler.handlePacket
    description: 确认宠物索引和命令定义，随机判定指令结果。
- id: beidou.pets.movement
  kind: operation
  name: 更新宠物移动与展示
  summary: 原生移动包解析后只更新角色已有宠物的位置，并向地图其他成员广播；不存在的宠物槽或空移动不执行。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/MovePetHandler.java
    value: MovePetHandler.handlePacket
    description: 核对宠物索引后更新位置并广播移动。
- id: beidou.pets.loot
  kind: operation
  name: 让宠物拾取附近物品或金币
  summary: 拾取需角色已召唤宠物，金币磁铁或物品袋资格、启用的排除列表及原生距离检查；通过后交给角色原生pickupItem处理物品归属与结算。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetLootHandler.java
    value: PetLootHandler.handlePacket
    description: 校验召唤、拾取装备、过滤和距离后调用原生拾取。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetLootHandler.java
    value: PetLootHandler.checkPetPickupDistance
    description: 按玩家位置、传送前位置、宠物位置初始化与距离判定是否放行。
- id: beidou.pets.exclusions
  kind: data
  name: 宠物拾取排除列表
  summary: 过滤列表按宠物唯一ID保存，并在召唤与提交时加载到角色缓存；Integer.MAX_VALUE用于金币过滤。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/dao/entity/PetignoresDO.java
    description: 宠物与被排除物品ID的持久记录。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.loadPetExcludedItems
    description: 按宠物ID加载过滤配置。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.updatePetExcludedItems
    description: 按完整提交列表差异更新过滤记录与缓存。
- id: beidou.pets.configure-exclusions
  kind: operation
  name: 修改宠物拾取过滤
  summary: 只有角色自己的有效宠物索引可提交完整过滤列表；负数物品ID拒绝，合法列表经加载旧值、差异更新与缓存提交生效。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetExcludeItemsHandler.java
    value: PetExcludeItemsHandler.handlePacket
    description: 确认宠物归属，拒绝负数物品ID，保存并提交排除列表。
- id: beidou.pets.autopot
  kind: operation
  name: 通过宠物补药入口使用药品
  summary: 原生入口委托补药处理器；处理器核角色存活、当前HP/MP、背包槽和药品ID，并依警戒线/强制配置或单次模式计算消耗，再沿StatEffect应用恢复。
  aliases:
  - 自动补药
  - 自动吃药
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetAutoPotHandler.java
    value: PetAutoPotHandler.handlePacket
    description: 读取药品槽和物品ID并进入原生补药处理器。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/processor/action/PetAutopotProcessor.java
    value: PetAutopotProcessor.runAutopotAction
    description: 创建并执行补药动作，复用背包消耗和药品效果。
- id: beidou.pets.native-rules
  kind: invariant
  name: 宠物动作保留各自原生资格
  summary: 召唤、食物、指令、移动、拾取和补药各自检查自己的原生条件；不能从某个处理器存在归属检查推断所有宠物入口均完成相同授权或装备验证。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetLootHandler.java
    value: PetLootHandler.handlePacket
    description: 拾取使用自身召唤、装备、过滤和距离条件。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetFoodHandler.java
    value: PetFoodHandler.handlePacket
    description: 喂食使用自身限频、食物和在场宠物条件。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PetAutoPotHandler.java
    value: PetAutoPotHandler.handlePacket
    description: 补药入口只委托现有处理器，不据此额外承诺活跃宠物验证。
