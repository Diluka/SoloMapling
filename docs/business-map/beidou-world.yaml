flows:
- id: beidou.world.change-channel.flow
  name: 原生频道迁移
  summary: 保留原生拒绝路径，并把发送迁移连接信息与目标频道实际上线区分。
  scenario: beidou.world.change-channel
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 请求切换频道
    summary: 读取目标频道并检查当前交互。
    concept: beidou.world.change-channel
  - id: interaction
    kind: decision
    name: 当前交互允许迁移
    summary: 同频道请求会断开，商城、小游戏、商店或交易中的请求不迁移。
    concept: beidou.world.travel-rules
  - id: eligibility
    kind: decision
    name: 角色、地图和目标频道允许
    summary: 封禁、死亡、禁止迁移地图、迷你地牢或目标频道不可用时拒绝。
    concept: beidou.world.travel-rules
  - id: save
    kind: action
    name: 移除当前成员并保存
    summary: 保存增益与角色状态，移除当前地图和频道成员。
    concept: beidou.world.change-channel
  - id: transition
    kind: outcome
    name: 进入频道过渡
    summary: 发送目标频道地址，后续目标频道登录由原生角色生命周期处理。
  - id: rejected
    kind: outcome
    name: 不执行频道迁移
    summary: 按入口规则恢复操作或断开连接；未发生正常频道迁移。
  transitions:
  - from: request
    to: interaction
  - from: interaction
    to: eligibility
    when: 当前交互允许且目标不是当前频道
  - from: interaction
    to: rejected
    when: 同频道或存在限制交互
  - from: eligibility
    to: save
    when: 资格满足且频道可用
  - from: eligibility
    to: rejected
    when: 任一角色、地图或频道检查不满足
  - from: save
    to: transition
- id: beidou.world.start-event.flow
  name: 申请队伍事件场次
  summary: 展示队伍事件入口的大厅与 setup 拒绝路径；开始调用不构成玩法完成证据。
  scenario: beidou.world.start-event
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 队伍申请事件场次
    summary: 入口由队伍及队长、当前地图申请事件。
    concept: beidou.world.start-event
  - id: admission
    kind: decision
    name: 入口与大厅可用
    summary: 检查管理器未释放、队长未占并发许可、许可可取得及大厅可用。
    concept: beidou.world.start-event
  - id: setup
    kind: action
    name: 调用脚本建立实例
    summary: 运行 setup 并登记命名实例与大厅。
    concept: beidou.world.start-event
  - id: instance
    kind: decision
    name: 实例创建可继续
    summary: 同名实例或 setup 无法产生实例时释放本次大厅占用；其他脚本错误须查看实际证据。
    concept: beidou.world.instance
  - id: register
    kind: action
    name: 登记可参与成员并启动事件
    summary: 按队伍资格、在线与当前地图登记成员，再调用事件开始。
    concept: beidou.world.participation
  - id: running
    kind: outcome
    name: 进入脚本事件生命周期
    summary: 事件已推进启动调用；实际成员、脚本异常、目标达成与奖励仍需分别核对。
  - id: refused
    kind: outcome
    name: 未建立本次场次
    summary: 入口或 setup 拒绝本次申请，调用方不得推定已经入场。
  - id: uncertain
    kind: outcome
    name: 脚本异常，需核对实际后态
    summary: 部分脚本异常被记录后入口仍可能返回 true；实例或成员可能尚未完整建立，不据此确认成功或自动重试。
  transitions:
  - from: request
    to: admission
  - from: admission
    to: setup
    when: 入口许可和大厅可用
  - from: admission
    to: refused
    when: 入口停用、并发冲突或无可用大厅
  - from: setup
    to: instance
  - from: instance
    to: register
    when: 取得可登记实例并正常继续
  - from: instance
    to: refused
    when: 同名实例或 setup 无法建立实例
  - from: register
    to: running
  - from: instance
    to: uncertain
    when: 出现其他脚本异常或缺少回调
