- from: beidou.world.change-map
  type: invokes
  to: beidou.world.load-scene
  summary: 原生跨图按公共地图或当前事件实例取得目标地图。
- from: beidou.world.change-map
  type: invokes
  to: beidou.world.membership
  summary: 跨图沿原生地图成员移除与加入完成场景切换。
- from: beidou.world.change-channel
  type: writes
  to: beidou.identity.characters
  summary: 换频道移除当前在线成员后调用 saveCharToDB 保存角色。
- from: beidou.world.change-channel
