schemaVersion: 1
map:
  id: beidou-quests
  title: 北斗上游：任务、NPC与挑战
  summary: 从任务状态、原生对话及脚本和Java挑战规则建立的功能地图。
nodes:
- id: beidou.quests
  kind: domain
  name: 北斗：任务、NPC与挑战规则
  summary: 固定北斗1.12的任务资格、进度、NPC交互及组队/比赛挑战规则。事件实例和地图运行基础由世界域提供。
  aliases:
  - 任务
  - NPC
  - 组队任务
  - PQ
  anchors:
  - kind: directory
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest
    description: 定位任务需求、动作与勋章规则。
  - kind: directory
    value: upstream/BeiDou-Server/gms-server/scripts-zh-CN
    description: 定位当前中文NPC、任务与事件脚本。
- id: beidou.quests.quest-lifecycle
  kind: capability
  name: 维护任务生命周期
  summary: 依据WZ任务需求与动作组织未接取、进行中、完成、可重复接取和放弃生命周期；特殊任务与勋章保留专门规则。
  aliases:
  - 任务系统
  - 勋章任务
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    description: 查看任务状态、需求、动作与可重复条件。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/QuestStatus.java
    description: 查看任务状态、击杀/字符串进度、时间和放弃次数。
  - kind: directory
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/medal
    description: 定位有独立规则的勋章任务。
- id: beidou.quests.start
  kind: scenario
  name: 接取任务
  summary: 玩家任务入口先检查地图NPC/距离和任务需求，再选择脚本交互或普通开始动作；普通任务全部动作检查通过后才执行动作并进入进行中。
  aliases:
  - 任务接取
  - 开始任务
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/QuestActionHandler.java
    value: QuestActionHandler.handlePacket
    description: 核对接取、脚本开始、地图与NPC距离分支。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    value: Quest.start
    description: 核对自动开始或接取资格及全部开始动作检查。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/ItemAction.java
    value: ItemAction.check
    description: 任务配置物品动作时核所需物品和背包可容纳条件。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/ItemAction.java
    value: ItemAction.run
    description: 运行任务物品动作，先扣所需物品再发奖励物品。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/MesoAction.java
    value: MesoAction.runAction
    description: 按任务金币动作及配置倍率增减原生金币。
- id: beidou.quests.complete
  kind: scenario
  name: 交付任务并执行奖励
  summary: 玩家交付入口检查进行中状态、完成需求与NPC资格，转任务脚本或普通完成动作；普通路径先检查动作，再标完成并运行奖励等动作。
  aliases:
  - 任务完成
  - 交任务
  - 任务奖励
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/QuestActionHandler.java
    value: QuestActionHandler.handlePacket
    description: 核对交付和脚本结束入口的资格及奖励选择。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    value: Quest.complete
    description: 核对完成动作检查、标记完成与动作执行顺序。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/ExpAction.java
    value: ExpAction.run
    description: 任务配置经验动作时调用原生gainExp并应用相应倍率。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/ItemAction.java
    value: ItemAction.check
    description: 任务配置物品动作时核所需物品和背包可容纳条件。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/ItemAction.java
    value: ItemAction.run
    description: 运行任务物品动作，先扣所需物品再发奖励物品。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/actions/MesoAction.java
    value: MesoAction.runAction
    description: 按任务金币动作及配置倍率增减原生金币。
- id: beidou.quests.forfeit
  kind: operation
  name: 放弃进行中的任务
  summary: 仅进行中的任务允许放弃，移除任务计时提示，重新标为未接取并增加放弃次数。
  aliases:
  - 放弃任务
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    value: Quest.forfeit
    description: 确认进行中限制、计时移除、状态复位和放弃次数。
- id: beidou.quests.progress
  kind: data
  name: 角色任务状态与进度
  summary: 每角色任务的状态、击杀/字符串进度、NPC、时间及放弃次数；战斗和脚本可推进进度，最终存档仍由角色原生持久化负责。
  aliases:
  - QuestStatus
  - 任务进度
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/QuestStatus.java
    description: 查看任务状态与进度结构。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.raiseQuestMobCount
    description: 怪物击杀后更新已接任务的相关计数。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.updateQuestStatus
    description: 更新任务状态并安排角色任务通知。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/medal/VeteranHunterMedal.java
    value: VeteranHunterMedal.onMonsterKilled
    description: 只对已接且击杀等级合格的老猎手勋章任务增加进度。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/medal/SpecialChallengeMedal.java
    value: SpecialChallengeMedal.onMonsterKilled
    description: 特殊挑战勋章复用怪物死亡事件推进对应已接任务。
- id: beidou.quests.eligibility
  kind: invariant
  name: 任务状态、需求与NPC资格有效
  summary: 原生玩家入口检查任务状态、需求和信息进度，并核NPC地图/距离；自动任务有明确例外。脚本的forceStart/forceComplete不是玩家入口自动拥有的通用绕过权。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    value: Quest.canStart
    description: 核对接取状态、开始需求及信息进度。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/quest/Quest.java
    value: Quest.canComplete
    description: 核对进行中状态、完成需求及信息进度。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/QuestActionHandler.java
    value: QuestActionHandler.isNpcNearby
    description: 核对自动任务例外、地图NPC与位置距离。
- id: beidou.quests.npc-dialogue
  kind: interface
  name: 原生NPC与任务对话路由
  summary: 原生对话回复先区分QM与CM，再按当前CM的legacy或NextLevel上下文派发；包类型、拒绝和取消语义随真实路由变化。
  aliases:
  - CM
  - QM
  - NPCMoreTalk
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/NPCMoreTalkHandler.java
    value: NPCMoreTalkHandler.handlePacket
    description: 按当前QM/CM和回复类型接收文字、选择或取消。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/NPCMoreTalkHandler.java
    value: NPCMoreTalkHandler.cmRouting
    description: 按当前NextLevelContext选择legacy action或nextLevel。
- id: beidou.quests.talk
  kind: scenario
  name: 建立NPC脚本对话
  summary: 地图NPC点击进入原生脚本管理；脚本中心或道具等入口可指定脚本，各入口保留其自己的准入。建立CM后装载脚本，拒绝条件或脚本故障不算成功交互。
  aliases:
  - NPC对话
  - 脚本中心
  - legacy
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/NPCTalkHandler.java
    value: NPCTalkHandler.handlePacket
    description: 定位地图NPC点击、地图限制和对话启动。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/npc/NPCScriptManager.java
    value: NPCScriptManager.start
    description: 定位脚本名入口、点击间隔和CM/脚本建立。
- id: beidou.quests.reply
  kind: operation
  name: 回答或结束当前对话
  summary: legacy action和NextLevel按当前对话上下文推进；不同NextLevel类型对返回/拒绝/取消使用不同mode，正常结束或异常沿管理器清理。
  aliases:
  - NPC选择
  - NPC取消
  - NextLevel
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/npc/NPCScriptManager.java
    value: NPCScriptManager.action
    description: 派发legacy回复，脚本异常时清理。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/npc/NPCScriptManager.java
    value: NPCScriptManager.nextLevel
    description: 按当前NextLevel类型处理选择、返回与关闭。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/npc/NPCScriptManager.java
    value: NPCScriptManager.dispose
    description: 清理当前CM与脚本资源。
- id: beidou.quests.dialogue-context
  kind: data
  name: 当前CM/QM与脚本上下文
  summary: 原生Client当前绑定的NPC会话CM、任务会话QM与其脚本状态，决定下一次回复的目标和生命周期；二者不可仅按NPC模板ID混用。
  aliases:
  - 对话状态
  - NextLevelContext
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/npc/NPCConversationManager.java
    description: 查看CM及NextLevel上下文。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/quest/QuestActionManager.java
    description: 查看QM的任务、开始/结束状态。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Client.java
    description: 查看当前Client的CM/QM绑定。
- id: beidou.quests.scripted-quest
  kind: capability
  name: 通过任务脚本接取或交付
  summary: 任务脚本管理器维护QM、start/end脚本交互和清理；脚本入口仍检查任务状态及地图NPC等条件，具体剧情和收益由对应脚本决定。
  aliases:
  - 任务脚本
  - 剧情任务
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/quest/QuestScriptManager.java
    value: QuestScriptManager.start
    description: 定位任务开始脚本、QM建立与后续回复。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/quest/QuestScriptManager.java
    value: QuestScriptManager.end
    description: 定位任务结束脚本及状态/NPC资格检查。
- id: beidou.quests.party-challenge
  kind: scenario
  name: 组队进入并结束事件挑战
  summary: 事件规则决定招募、合格成员、阶段、通关、超时与离队收尾，调用世界域事件基础建立实例。KerningPQ仅作为一组已核实规则例证，不将其参数推广到全部任务。
  aliases:
  - 组队副本
  - KPQ
  - KerningPQ
  - 通关
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/npc/9020000.js
    value: action
    description: 定位废弃都市组队任务NPC的队伍/队长与启动选择。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/event/KerningPQ.js
    value: getEligibleParty
    description: 按同招募图、等级、人数与队长筛选参与队伍。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/event/KerningPQ.js
    value: clearPQ
    description: 确认通关标记和事件计时停止。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/event/KerningPQ.js
    value: end
    description: 确认超时或失败后退出成员并释放实例。
- id: beidou.quests.challenge-rules
  kind: invariant
  name: 以具体任务规则判定准入和完成
  summary: 每个挑战使用自己的队伍、等级、人数、地图、阶段与时间条件；本例配置可解除人数或等级限制，通关与奖励领取分别验证。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/event/KerningPQ.js
    value: getEligibleParty
    description: 检查本例的可配置人数/等级限制、同图与队长条件。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/scripts-zh-CN/event/KerningPQ.js
    value: scheduledTimeout
    description: 确认本例计时结束后的失败收尾。
- id: beidou.quests.challenge-reward
  kind: operation
  name: 领取事件配置的奖励
  summary: 事件配置奖励按档位发经验或随机物品，有物品奖励时先核背包格位；事件也可明确调用成员金币发放接口，按成员/地图和倍率发金币。通关、配置奖励及实际发放是不同事实。
  aliases:
  - 副本奖励
  - 随机奖励
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/event/EventInstanceManager.java
    value: EventInstanceManager.giveEventReward
    description: 核对奖励档位、纯经验、背包空间与随机物品分支。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/scripting/event/EventInstanceManager.java
    value: EventInstanceManager.giveEventPlayersMeso
    description: 事件明确调用时，按登记成员、可选地图和角色金币倍率发放金币。
- id: beidou.quests.competitive-challenges
  kind: capability
  name: 处理Java驱动的比赛和挑战
  summary: 嘉年华按CP等规则结算，阿里安特按积分及公平性计算奖励，金字塔按击杀、miss和随时间变化的能量条控制挑战；这些规则不只存在于事件脚本。
  aliases:
  - 怪物嘉年华
  - 阿里安特
  - 金字塔
  - 比赛
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/partyquest/MonsterCarnival.java
    value: MonsterCarnival.complete
    description: 定位双方CP比较与比赛结束分支。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/partyquest/AriantColiseum.java
    value: AriantColiseum.distributeAriantPoints
    description: 定位积分、奖励档和不公平比赛处理。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/partyquest/Pyramid.java
    value: Pyramid.startGaugeSchedule
    description: 定位随时间减少的挑战能量及阶段判断。
- id: beidou.quests.table-games
  kind: capability
  name: 原生五子棋与记忆翻牌
  summary: 原生OMOK与MATCH_CARD提供双人房间、密码和访客、准备/开始、落子或配对、认输/和棋与离场；房间和比赛状态由MiniGame维护，属于竞技玩法，独立于EIM事件和交易商店。
  aliases:
  - 五子棋
  - 记忆翻牌
  - OMOK
  - MATCH_CARD
  - 桌游
  - 小游戏
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PlayerInteractionHandler.java
    value: PlayerInteractionHandler.handlePacket
    description: 定位createType 1/2、加入、准备/开始、落子/翻牌、认输/和棋、退出和赛后退出分支；共用入口不转移玩法归属。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.minigameMatchStarted
    description: 开始本局并初始化赛后退出标志。
- id: beidou.quests.play-table-game
  kind: scenario
  name: 加入桌游、完成对局并收尾
  summary: 创建房间核存活、迷你房间资格及对应道具；访客加入核密码和空位。五子棋连线或翻牌积分触发胜负，认输和接受和棋走对应结算。游客在对局中退出判房主胜，房主退出关闭房间；赛后退出按标志执行，不能泛称所有离场都判负。
  aliases:
  - 小游戏对局
  - 五子棋胜负
  - 翻牌积分
  - 认输
  - 和棋
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PlayerInteractionHandler.java
    value: PlayerInteractionHandler.handlePacket
    description: 核创建、加入、行动、和棋、认输及退出的实际原生分支。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.setPiece
    description: 五子棋落子及连线判胜。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.setOwnerPoints
    description: 翻牌积分达到本局配对总量后判定胜负或平局。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.minigameMatchOwnerWins
    description: 在本局仍进行中时结算房主胜利、记录战绩并处理赛后退出。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.minigameMatchDraw
    description: 记录平局，房间平局积分另受五分钟间隔约束。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.removeVisitor
    description: 游客进行中离场判房主胜，并解绑游客。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/maps/MiniGame.java
    value: MiniGame.closeRoom
    description: 关闭房间并解除双方MiniGame绑定。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Character.java
    value: Character.closeMiniGame
    description: 按房主或游客分别关闭房间/移除游客。
- id: beidou.quests.table-game-state
