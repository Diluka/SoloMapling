flows:
- id: beidou.quests.start.flow
  name: 普通任务接取与拒绝
  summary: 覆盖普通Quest.start的动作检查；脚本任务另由QM驱动，玩家包入口还有地图和NPC资格检查。
  scenario: beidou.quests.start
  startsAt: start
  steps:
  - id: start
    kind: action
    name: 尝试普通任务接取
    summary: 读取角色现有任务状态、开始需求及自动开始设置。
    concept: beidou.quests.start
  - id: eligible
    kind: decision
    name: 自动开始或满足接取需求
    summary: 普通接取必须满足状态、需求和信息进度；autoStart有源码例外。
    concept: beidou.quests.eligibility
  - id: check-actions
    kind: decision
    name: 全部开始动作检查通过
    summary: 逐一检查开始动作的背包、物品等条件，失败立即返回。
  - id: refused
    kind: outcome
    name: 本次未接取任务
    summary: 未运行开始动作和forceStart；保持当前任务状态。
  - id: run
    kind: action
    name: 执行开始动作并标为进行中
    summary: 按开始动作执行后调用forceStart更新状态。
    concept: beidou.quests.start
  - id: started
    kind: outcome
    name: 任务进入进行中
    summary: 可继续推进进度、交付或放弃。
  transitions:
  - from: start
    to: eligible
  - from: eligible
    to: check-actions
    when: 自动开始或需求满足
  - from: eligible
    to: refused
    when: 普通接取需求不满足
  - from: check-actions
    to: run
    when: 全部开始动作检查通过
  - from: check-actions
    to: refused
    when: 任一开始动作检查失败
  - from: run
    to: started
- id: beidou.quests.talk.flow
  name: 当前NPC与任务的选择回复路由
  summary: 展示非文本回复路径：按真实QM/CM和当前NextLevel上下文路由；同一取消字节不可套用于全部对话。文本输入另有原生分支。
  scenario: beidou.quests.talk
  startsAt: receive
  steps:
  - id: receive
    kind: action
    name: 收到原生非文本对话回复
    summary: 解析非文本回复的mode和选择；本流程不代替文本输入路径。
    concept: beidou.quests.reply
  - id: owner
    kind: decision
    name: 当前回复属于哪类会话
    summary: 优先当前QM；无QM时检查当前CM。
    concept: beidou.quests.dialogue-context
  - id: quest
    kind: action
    name: 交给任务开始或结束脚本
    summary: 依据QM的isStart派发start或end，由任务脚本决定继续和结束。
    concept: beidou.quests.scripted-quest
  - id: route
    kind: decision
    name: 当前CM是否为NextLevel
    summary: 依据当前CM的NextLevelContext而非NPC模板或历史包猜测。
    concept: beidou.quests.npc-dialogue
  - id: legacy
    kind: action
    name: 沿legacy action回答
    summary: 使用原生mode/type/selection推进，脚本决定结束。
    concept: beidou.quests.reply
  - id: next
    kind: action
    name: 沿NextLevel类型回答
    summary: 按选择型、输入型或顺序型的语义返回、拒绝或关闭。
    concept: beidou.quests.reply
  - id: ignored
    kind: outcome
    name: 没有当前会话可路由
    summary: 无当前QM和CM时不建立新的对话授权。
  - id: handled
    kind: outcome
    name: 按当前会话处理回复
    summary: 脚本可继续对话、正常结束或异常清理，业务收益由具体脚本决定。
  transitions:
  - from: receive
    to: owner
  - from: owner
    to: quest
    when: 当前存在QM
  - from: owner
    to: route
    when: 没有QM且存在CM
  - from: owner
    to: ignored
    when: 当前QM和CM均不存在
  - from: quest
    to: handled
  - from: route
    to: legacy
    when: levelType为空
  - from: route
    to: next
    when: levelType非空
  - from: legacy
    to: handled
  - from: next
    to: handled
- id: beidou.quests.party-challenge.flow
  name: KerningPQ准入与结束
  summary: 以固定中文KerningPQ规则说明组队准入、事件启动、通关或失败；其他任务拥有各自参数与阶段规则。
  scenario: beidou.quests.party-challenge
  startsAt: entry
  steps:
  - id: entry
    kind: action
    name: 队长通过招募NPC申请
    summary: NPC核队伍和队长身份后查询事件资格。
    concept: beidou.quests.party-challenge
  - id: eligible
    kind: decision
    name: 合格队伍满足本任务规则
    summary: 核同图成员、当前配置的等级/人数范围及队长。
    concept: beidou.quests.challenge-rules
  - id: refused
    kind: outcome
    name: 本次未进入挑战
    summary: 不满足资格或大厅不可用时不建立本次参与实例。
  - id: lobby
    kind: decision
    name: 事件大厅是否可用
    summary: 原生事件基础拒绝已释放管理器或占用大厅。
  - id: running
    kind: action
    name: 进入实例并推进阶段
    summary: 建立实例、计时、登记成员并传入入口地图，按阶段脚本协作。
    concept: beidou.quests.party-challenge
  - id: result
    kind: decision
    name: 通关或触发结束条件
    summary: 阶段完成可通关；超时、成员不足或未通关解散等触发失败收尾。
  - id: clear
    kind: outcome
    name: 标记通关并停止计时
    summary: clearPQ标记eventCleared；奖励格位和领取是后续独立条件。
  - id: exit
    kind: outcome
    name: 成员退出且实例释放
    summary: end逐个退出并dispose，不标为通关。
  transitions:
  - from: entry
    to: eligible
  - from: eligible
    to: lobby
    when: 本任务资格满足
  - from: eligible
    to: refused
    when: 本任务资格不足
  - from: lobby
    to: running
    when: 大厅可用并启动实例
  - from: lobby
    to: refused
    when: 大厅占用或管理器不可启动
  - from: running
    to: result
  - from: result
    to: clear
    when: 达到通关条件
  - from: result
    to: exit
    when: 超时或队伍条件触发失败结束
