flows:
- id: solo.recreation.blackjack.flow
  name: 参加牌局并识别实际派彩边界
  summary: 区分入桌拒绝、回合胜负与当前北斗适配能否投放中奖筹码。
  scenario: solo.recreation.blackjack
  startsAt: join
  steps:
  - id: join
    kind: decision
    name: 牌桌是否可以接纳玩家
    summary: 已在桌或满桌时拒绝，否则等待下轮。
    concept: solo.recreation.blackjack
  - id: rejected
    kind: outcome
    name: 未加入牌桌
    summary: 已在桌或满桌，参与者集合不新增。
  - id: round
    kind: action
    name: 按地面下注与玩家行动进行回合
    summary: 无下注可跳过，连续三次无下注会离桌；有下注者发牌并选择 Hit 或 Stand。
    concept: solo.recreation.blackjack
  - id: result
    kind: decision
    name: 本轮属于哪种结果
    summary: 按牌点、爆牌与 Blackjack 规则判定。
    concept: solo.recreation.blackjack-rules
  - id: no-hand
    kind: outcome
    name: 本轮跳过或离桌
    summary: 没有参与手牌不进入中奖或输局结算。
  - id: push
    kind: outcome
    name: 平局保留地面原注
    summary: 不额外派彩也不收取原注。
  - id: collect
    kind: action
    name: 核对并收取输局原注
    summary: 仍在地面的筹码由庄家收走，收回下注者扣人气并离桌。
    concept: solo.recreation.blackjack-settlement
  - id: lost
    kind: outcome
    name: 输局处理结束
    summary: 已收注或进入收回原注的惩罚分支。
  - id: owner
    kind: decision
    name: 中奖者是否满足当前不过期道具所有者条件
    summary: 当前适配要求 owner 为已登记环境机器人。
    concept: solo.recreation.prop-ownership
  - id: blocked
    kind: outcome
    name: 普通玩家中奖投放受限
    summary: 真人 owner 会被北斗适配拒绝，不能宣称已经派彩或回合完整完成。
  - id: payout
    kind: action
    name: 尝试逐个投放额外筹码
    summary: 普通胜利按原注数量，Blackjack 按一点五倍取整；仍受地图掉落限制。
    concept: solo.recreation.blackjack-settlement
  - id: attempted
    kind: outcome
    name: 到达环境机器人派彩路径
    summary: 仅描述源码可到达路径，实际游戏奖励与回合收尾仍需玩法验收。
  transitions:
  - from: join
    to: rejected
    when: 已在桌或满桌
  - from: join
    to: round
    when: 可以接纳
  - from: round
    to: result
  - from: result
    to: no-hand
    when: 无参与手牌
  - from: result
    to: push
    when: 平局
  - from: result
    to: collect
    when: 输局
  - from: collect
    to: lost
  - from: result
    to: owner
    when: 普通胜利或 Blackjack 胜利
  - from: owner
    to: blocked
    when: 普通玩家 owner
  - from: owner
    to: payout
    when: 已登记环境机器人 owner
  - from: payout
    to: attempted
- id: solo.recreation.drop-game.flow
  name: 付费掉落游戏的拒绝与退出
  summary: 描述金额、奖池、入队和游戏时限各分支，不把交易确认或退款文案当作资产结算证据。
  scenario: solo.recreation.drop-game
  startsAt: price
  steps:
  - id: price
    kind: decision
    name: 锁定金额是否匹配档位
    summary: 等待对方锁定，接受一千万或五千万金币；取消、锁定超时或金额不符退出。
    concept: solo.recreation.drop-game
  - id: refused
    kind: outcome
    name: 取消交易并重置
    summary: 沿原生交易取消路径结束，没有进入掉落游戏。
  - id: confirm
    kind: action
    name: 请求确认原生交易并加载奖池
    summary: 当前源码延时后进入档位准备，不能据此宣称真实交易结算已经核验。
    concept: solo.recreation.drop-game
  - id: pool
    kind: decision
    name: 奖池是否可用
    summary: 按档位加载奖池，空池进入清理重置。
    concept: solo.recreation.loot-pools
  - id: empty
    kind: outcome
    name: 空奖池重置且退款后态未保证
    summary: 源码虽提示退款，但此处只执行交易清理与重置，不建立退款完成事实。
  - id: party
    kind: decision
    name: 玩家是否及时加入机器人队伍
    summary: 邀请失败或等待超时会结束，源码对未入队超时明确不退费。
    concept: solo.recreation.drop-game
  - id: forfeit
    kind: outcome
    name: 未开局结束且不自动退款
    summary: 邀请失败或未及时同队时重置；不宣称已退还金币。
  - id: play
    kind: action
    name: 启动限时移动与奖池掉落
    summary: 同队后准备加速与掉落，奖品作为地图道具供玩家按规则拾取。
    concept: solo.recreation.drop-game
  - id: end
    kind: decision
    name: 玩家离图还是游戏到时
    summary: 任一条件结束异步投放，停止移动并清理机器人队伍。
    concept: solo.recreation.drop-game
  - id: left
    kind: outcome
    name: 玩家离图提前结束
    summary: 停止后续掉落并尝试离队清理，不恢复已发生收益或费用。
  - id: elapsed
    kind: outcome
    name: 游戏时间结束
    summary: 停止后续掉落并进入告别与队伍清理，实际奖励后态需独立验收。
  transitions:
  - from: price
    to: refused
    when: 取消、超时或金额不匹配
  - from: price
    to: confirm
    when: 金额匹配已锁定
  - from: confirm
    to: pool
  - from: pool
    to: empty
    when: 空奖池或读取失败
  - from: pool
    to: party
    when: 奖池可用
  - from: party
    to: forfeit
    when: 邀请失败或未及时加入
  - from: party
    to: play
    when: 玩家与机器人实际同队
  - from: play
    to: end
  - from: end
    to: left
    when: 玩家离开地图
  - from: end
    to: elapsed
    when: 游戏时限到达
