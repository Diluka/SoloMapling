- from: solo.recreation.chip-catalog
  type: part_of
  to: solo.recreation
  summary: 休闲游戏定义筹码道具与参考面值。
- from: solo.recreation.prop-ownership
  type: part_of
  to: solo.recreation
  summary: 游戏道具的北斗适配限制在此集中记录。
