  summary: 休闲游戏拥有牌桌与回合状态。
- from: solo.recreation.blackjack-settlement
  type: part_of
  to: solo.recreation
  summary: 牌局筹码结算属于休闲游戏规则。
- from: solo.recreation.blackjack-rules
  type: part_of
