- from: solo.population.load-plan
  type: reads
  to: solo.population.plan
  summary: 按人口文件解析各批次配置。
- from: solo.population.initialize
  type: invokes
  to: solo.population.load-plan
  summary: 启动批次先读取已解析的来源与计划。
- from: solo.population.initialize
  type: invokes
  to: solo.population.create-bot
  summary: 各批次创建运行期环境角色。
- from: solo.population.create-bot
  type: writes
  to: solo.population.bots
  summary: 登记新角色并分配不冲突的运行 ID。
- from: solo.population.remove-bot
  type: writes
  to: solo.population.bots
  summary: 移除精确对象的登记。
- from: solo.population.create-bot
  type: constrained_by
  to: solo.population.identity-rule
  summary: 发布角色前复核登记和当前性。
- from: solo.population.create-bot
  type: constrained_by
  to: solo.population.template-rule
  summary: 生成依赖唯一既有模板。
- from: solo.population.create-bot
  type: consumes
  to: beidou.identity.native-character
  summary: 通过北斗 Character.loadCharFromDB 读取模板原生数据。
- from: solo.population.create-bot
  type: reads
  to: beidou.identity.characters
  summary: 只读加载模板及检测持久角色 ID 冲突。
- from: solo.population.create-bot
  type: writes
  to: beidou.world.scene
  summary: 使用原生地图 addPlayer 发布运行期环境角色。
- from: solo.population.remove-bot
  type: writes
  to: beidou.world.scene
  summary: 从原生地图和在线存储移除该环境角色。
- from: solo.population.create-bot
  type: publishes
  to: solo.population.bot-source
  summary: 向 Solo 行为提供已登记环境角色。
- from: solo.population.stop-world
  type: invokes
  to: solo.population.remove-bot
  summary: 停止回调后清除当前登记角色。
- from: solo.population.initialize
  type: invokes
  to: solo.market.populate
  summary: 启用相应批次时安排人工自由市场铺店。
- from: solo.population.initialize
  type: invokes
  to: solo.companions.train
  summary: 训练群组生成后按 TRAINING_BOT 类型启动旧 V1 训练行为。
- from: solo.population.initialize
  type: invokes
  to: solo.social.ambient-chat
  summary: 按 startSocialSystems 开关启动环境群聊系统；实际群聊仍核真人在场与冷却。
- from: solo.population.initialize
  type: invokes
  to: solo.recreation.blackjack
  summary: 特色批次生成牌桌与庄家并启动旧 V1 牌局行为；不保证真人结算已可用。
- from: solo.population.initialize
  type: invokes
  to: solo.recreation.drop-game
  summary: 按批次生成掉落游戏主持者，付费和回合仍由游戏域裁决。
- from: solo.population.initialize
  type: invokes
  to: solo.recreation.gacha-display
  summary: 相应批次生成并启动扭蛋表演机器人。
- from: solo.population.initialize
  type: invokes
  to: solo.recreation.hospitality
  summary: 按 gameZoneHosts 设置生成迎宾游戏主持者。
- from: solo.population.initialize
  type: invokes
  to: solo.onboarding.tutorial
  summary: 仅在对应essentials批次及tutorial开关启用时生成TutorialBot并启动其教程状态机，不泛化为所有部署默认开启。
flows:
- id: solo.population.initialize.flow
  name: 按配置建立环境人口
  summary: 显式配置错误会阻止正常初始化；模板或生成失败按现有调用路径传播，不用默认人口掩盖显式配置问题。
  scenario: solo.population.initialize
  startsAt: read-plan
  steps:
  - id: read-plan
    kind: action
    name: 读取人口计划
    summary: 解析来源、比例和批次。
    concept: solo.population.load-plan
  - id: plan-valid
    kind: decision
    name: 计划能否读取
    summary: 显式文件错误不能静默采用默认值。
  - id: failed
    kind: outcome
    name: 初始化失败
    summary: 保留错误，启动入口执行已有清理。
  - id: create
    kind: action
    name: 执行启用批次
    summary: 按计划加载模板并创建环境角色。
    concept: solo.population.create-bot
  - id: creation-result
    kind: decision
    name: 角色是否建立成功
    summary: 模板须唯一可加载，创建过程中错误会沿现有调用路径传播；未确认成功不计作在线角色。
  - id: created
    kind: outcome
    name: 人口已按批次安排生成
    summary: 后续异步到场和店铺行为仍需实际在线观察，不能以累计数认定完成。
  - id: creation-failed
    kind: outcome
    name: 该生成未成功建立角色
    summary: 记录实际异常与残留后态，不能用批次安排或累计计数代替已进入世界。
  transitions:
  - from: read-plan
    to: plan-valid
  - from: plan-valid
    to: failed
    when: 显式计划读取失败
  - from: plan-valid
    to: create
    when: 成功读取或合法默认回退
  - from: create
    to: creation-result
  - from: creation-result
    to: created
    when: 模板和角色创建成功
  - from: creation-result
    to: creation-failed
    when: 模板读取或角色创建失败
