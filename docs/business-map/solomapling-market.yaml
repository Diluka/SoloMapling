  to: solo.market.generate-stock
  summary: 铺设市场时生成相应人工货源。
- from: solo.market.populate
  type: invokes
  to: solo.market.open-store
  summary: 随机选择角色商店时开放原生货架。
- from: solo.market.generate-stock
  type: reads
  to: solo.market.catalog
  summary: 生成货源使用商品池、版本和档次配置。
- from: solo.market.generate-stock
  type: invokes
  to: solo.market.price-stock
  summary: 货品入架前计算实际价格和数量。
- from: solo.market.price-stock
  type: writes
  to: solo.market.quotes
  summary: 报价规则形成人工货架的实际价格与批数。
- from: solo.market.browse-buy
  type: reads
  to: solo.market.quotes
  summary: 买家以实际标价和剩余批数选择商品。
- from: solo.market.browse-buy
  type: reads
  to: solo.market.catalog
  summary: 买家以 Solo 商品池估值判断标价比例。
- from: solo.market.browse-buy
  type: writes
  to: beidou.economy.inventory
  summary: 实际购买沿原生 buy 把货品加入机器人背包。
- from: solo.market.browse-buy
  type: writes
  to: beidou.economy.wallet
  summary: 实际购买委托原生商店扣款和卖方收益结算。
- from: solo.market.direct-trade
  type: consumes
  to: beidou.economy.trade-entry
  summary: 机器人邀请、访问、确认与取消均沿北斗原生 Trade 接口。
- from: solo.market.direct-trade
  type: reads
  to: solo.market.sale-intent
  summary: 买卖流程根据已登记广告与求购条件判断意愿。
- from: solo.market.direct-trade
  type: invokes
  to: solo.market.reserve-offer
  summary: 买卖双方先准备真实原生物品或金币托管。
- from: solo.market.direct-trade
  type: invokes
  to: solo.market.confirm-trade
  summary: 意愿满足后复核并提交原生确认。
- from: solo.market.direct-trade
  type: invokes
  to: solo.market.abort-trade
  summary: 无货、托管不符等失败路径取消交易。
- from: solo.market.reserve-offer
  type: writes
  to: beidou.economy.inventory
  summary: 货源实体化、库存扣减与托管拒绝返还使用原生背包。
- from: solo.market.reserve-offer
  type: writes
  to: beidou.economy.wallet
  summary: 登记机器人的资金补足与金币托管沿原生钱包路径。
- from: solo.market.abort-trade
  type: writes
  to: solo.market.sale-intent
  summary: 中止后清理广告、库存对应关系和求购条件。
- from: solo.market.direct-trade
  type: constrained_by
  to: solo.market.native-economic-rules
  summary: 意愿、托管和真实结算按不同事实判断。
- from: solo.market.browse-buy
  type: constrained_by
  to: solo.market.native-economic-rules
  summary: 选中商品不绕过原生商店购买和资产规则。
- from: solo.market.reprice
  type: writes
  to: solo.market.quotes
  summary: 接受报价改变人工商品标价，不直接转移金币或商品。
- from: solo.market.reprice
  type: reads
  to: solo.market.haggle-sessions
  summary: 在场处理读取尝试次数及当前还价。
- from: solo.market.reprice
  type: writes
  to: solo.market.haggle-sessions
  summary: 议价更新尝试、还价、锁定与会话清理。
- from: solo.market.nx-handoff
  type: invokes
  to: solo.market.direct-trade
  summary: 该源码场景以真实交易成功为交付前提。
- from: solo.market.populate
  type: constrained_by
  to: solo.social.language-rule
  summary: 店主名称与商店描述经 FMShopDescGen 的 LocalizedResources 选择市场语言资源和回退。
- from: solo.market.reprice
  type: constrained_by
  to: solo.social.language-rule
  summary: 议价接受、拒绝、还价及延迟改价通知使用 BotDialogueHandler 的本地化文案。
- from: solo.market.direct-trade
  type: invokes
  to: solo.social.broadcast
  summary: 商人广告及交易完成或取消反馈调用 V1 SocialCommands.BotSpeak 广播。
- from: solo.market.nx-handoff
  type: invokes
  to: solo.social.broadcast
  summary: 兑换码交付前后的地图提示沿 V1 SocialCommands.BotSpeak 发送。
- from: solo.market.nx-handoff
  type: writes
  to: beidou.economy.coupon-codes
  summary: NXCodeManager创建北斗nxcode/nxcode_items兑换码，实际核销由上游经济域拥有。
flows:
- id: solo.market.direct-trade.sell-flow
  name: 机器人卖出货品并确认原生结果
  summary: 保留无法备货、托管失配、对方报价不符和原生取消分支；不把 Solo 已确认意愿当成经济成交。
  scenario: solo.market.direct-trade
  startsAt: prepare
  steps:
  - id: prepare
    kind: action
    name: 准备广告货品
    summary: 进入同一原生交易，尝试把广告货品放入真实托管。
    concept: solo.market.reserve-offer
  - id: stock
    kind: decision
    name: 货品托管是否有效
    summary: 核备货成功和同一原生交易及托管对象。
    concept: solo.market.native-economic-rules
  - id: offer
    kind: decision
    name: 买方报价是否满足
    summary: 不满足且未锁定则等待；买方锁定不足报价时拒绝。
    concept: solo.market.sale-intent
  - id: wait
    kind: action
    name: 等待新报价
    summary: 继续观察报价，并受交易超时约束。
    concept: solo.market.direct-trade
  - id: recheck
    kind: decision
    name: 临确认托管及报价是否仍一致
    summary: 在原生交易共同锁内重新检查同一广告托管与买方报价，防止先前满足后被改变。
    concept: solo.market.confirm-trade
  - id: confirm
    kind: action
    name: 提交原生交易确认
    summary: 临确认复核通过后调用原生 completeTrade，等待实际结算结果。
    concept: solo.market.confirm-trade
  - id: settlement
    kind: decision
    name: 原生回调是否成功
    summary: 只有双方原生实际结算成功才进入成功结果。
    concept: solo.market.native-economic-rules
  - id: cancel
    kind: action
    name: 取消和清理
    summary: 备货失败、托管失配、拒绝或超时走原生取消及 Solo 清理。
    concept: solo.market.abort-trade
  - id: success
    kind: outcome
    name: 交易成功
    summary: 依据真实原生成功回调记录成交。
  - id: not-sold
    kind: outcome
    name: 未成交
    summary: 保留原生取消结果，不能记成成功。
  transitions:
  - from: prepare
    to: stock
  - from: stock
    to: offer
    when: 托管有效
  - from: stock
    to: cancel
    when: 备货失败或托管失配
  - from: offer
    to: recheck
    when: 报价满足
  - from: offer
    to: wait
    when: 报价不足且买方尚未锁定
  - from: offer
    to: cancel
    when: 报价不足已锁定或超时
  - from: wait
    to: offer
  - from: confirm
    to: settlement
  - from: settlement
    to: success
    when: 双方原生真实结算成功
  - from: settlement
    to: not-sold
    when: 原生取消或其他非成功结果
  - from: cancel
    to: not-sold
  - from: recheck
    to: confirm
    when: 同一托管和报价仍有效
  - from: recheck
    to: cancel
    when: 托管或报价已改变
