schemaVersion: 1
map:
  id: solo.runtime
  title: SoloMapling：统一角色运行与执行
  summary: 原生角色来源、模块控制、动作事实与可核验关闭的共享协议；自主玩法模块及实际验收范围分别核对。
nodes:
- id: solo.runtime
  kind: domain
  name: 统一角色运行与执行
  summary: 为可信角色来源和控制模块提供同一角色宿主、可核验执行与最终资源关闭；具体接线与验收范围由对应交付记录说明。
  aliases:
  - CharacterRuntime
  - 共享游戏基建
  anchors:
  - kind: file
    value: docs/robot-runtime/README.md
    description: 统一角色宿主、模块控制和精确资源关闭协议及对应交付范围。
- id: solo.runtime.bind-role
  kind: scenario
  name: 接纳并绑定原生角色
  summary: OPEN 前建立根作用域和唯一执行通道，登记原生创建结果，再由来源证明身份当前且世界来源一致后绑定。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.bindAdoptedOrigin
    description: 在来源身份和捕获世界代次有效时将已接纳角色从 OPENING 转为 BOUND。
- id: solo.runtime.modules
  kind: scenario
  name: 挂载与停止控制模块
  summary: 为已绑定角色挂载有限控制资源的模块，停止时撤销授权并等待工作、资源和生命周期回调真实退出。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.stop
    description: 按 PAUSE 或 UNLOAD 停止指定模块，撤销其 Grant 并开始本模块排空。
- id: solo.runtime.resume-module
  kind: operation
  name: 以新代次恢复模块
  summary: 只在许可有效且旧模块作用域已经排空后重新激活；控制资源冲突时保留未激活状态，不复活旧上下文。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.activate
    description: 为可激活模块建立新的 ModuleRef、ExecutionScope 和 Grant，检查控制资源占用。
- id: solo.runtime.close-role
  kind: scenario
  name: 关闭整个角色宿主
  summary: 停止并卸载全部模块，由根来源核验原生退出和释放证明，最后确认工作、资源与物理通道全部排空。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.beginClose
    description: 先停止模块再排空根作用域，角色释放和 CLOSED 分别由后续核验完成。
- id: solo.runtime.release-origin
  kind: operation
  name: 释放精确登记的角色资源
  summary: 仅在全部模块结束后、精确根清理执行体内调用原来源释放；未证实释放的资源继续保留债务。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.releaseOrigin
    description: 校验根作用域、CleanupAttempt、原角色 identity 与实际执行许可，再接收来源释放证明。
- id: solo.runtime.observe-role
  kind: operation
  name: 读取同一来源的角色事实
  summary: 每次从根 RoleBinding 读取当前原生事实并复核绑定，不维护第二份等级、背包或队伍档案。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.observeOrigin
    description: 经根来源读取角色快照并在返回前核验来源和宿主状态。
- id: solo.runtime.dispatch-chat
  kind: operation
  name: 执行共享原生普通聊天
  summary: 可信适配器准备动作后只向已有角色通道提交一次，沿原生聊天处理器派发，以真实包证据区分成功、失败与未知。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/action/NativeActionService.java
    value: NativeActionService.submitChat
    description: 唯一提交已准备的聊天动作，保留受理结果与实际派发结果的区别。
- id: solo.runtime.world-stop
  kind: scenario
  name: 在原世界停止窗口清理
  summary: 原子取得准确来源世界的停止票据，允许旧作用域清理原登记资源；新世界启动后不再借旧窗口进入原生对象。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/execution/ExecutionScope.java
    value: ExecutionScope.tryBeginWorldStop
    description: 取得或复用同一次世界停止票据；未知 inactive 状态不生成清理授权。
- id: solo.runtime.epoch
  kind: data
  name: 世界与场景引用
  summary: 固定捕获世界代次和精确 Character、Client、World、Channel 对象，场景引用再固定实际地图与事件实例。
  aliases:
  - WorldEpoch
  - CharacterRef
  - SceneRef
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/context/GameContext.java
    description: 固定捕获世界代次和精确 Character、Client、World、Channel 对象，场景引用再固定实际地图与事件实例。
- id: solo.runtime.role-binding
  kind: data
  name: 角色来源登记
  summary: 保存原生来源的精确身份、角色引用和释放握手；角色权威存档及来源自己的账号规则由来源提供。
  aliases:
  - RoleBinding
  - 根角色资源
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/runtime/RoleBinding.java
    description: 保存原生来源的精确身份、角色引用和释放握手；角色权威存档及来源自己的账号规则由来源提供。
- id: solo.runtime.module-state
  kind: data
  name: 模块执行代次与控制资源
  summary: 宿主记录模块配置许可、实例、执行代次、授权资源和停止结果；世界代次与模块代次分别核对。
  aliases:
  - ModuleRef
  - ModuleContext
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    description: 宿主记录模块配置许可、实例、执行代次、授权资源和停止结果；世界代次与模块代次分别核对。
- id: solo.runtime.work
  kind: data
  name: 工作与排空账本
  summary: 作用域记录取消请求、实际 body、carrier、发布结果与资源债务，普通工作和清理工作分别有界。
  aliases:
  - ExecutionScope
  - WorkHandle
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/execution/ExecutionScope.java
    description: 作用域记录取消请求、实际 body、carrier、发布结果与资源债务，普通工作和清理工作分别有界。
- id: solo.runtime.resources
  kind: data
  name: 精确资源与清理许可
  summary: 资源登记按实际对象和来源工作跟踪创建、接纳与释放，未知结果不据猜测抹除登记。
  aliases:
  - DrainPermit
  - CleanupAttempt
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/execution/ScopeResources.java
    description: 资源登记按实际对象和来源工作跟踪创建、接纳与释放，未知结果不据猜测抹除登记。
- id: solo.runtime.action-result
  kind: data
  name: 原生动作事实
  summary: 分别记录是否真正派发、是否取消、观察来源与完整性及成功或未知结果；事实完成不代表物理工作已结算。
  aliases:
  - NativeActionResult
  - ChatEvidence
  anchors:
  - kind: file
    value: beidou-integration/src/main/java/soloMapling/game/action/NativeActionResult.java
    description: 分别记录是否真正派发、是否取消、观察来源与完整性及成功或未知结果；事实完成不代表物理工作已结算。
- id: solo.runtime.command-api
  kind: interface
  name: 角色宿主控制接口
  summary: 可信 Java 模块以宿主当前上下文接纳工作、准备原生动作和提交有限控制命令；不向外开放任意 handler、包或脚本。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.ModuleContext.prepareNative
    description: 为已有原生动作提供同一 lane、permit 与 work，只准备而不再建立排队。
- id: solo.runtime.events
  kind: interface
  name: 安全运行事实窗口
  summary: 按独立运行体事件游标查询宿主、模块和工作事实；不保存聊天正文、异常正文或原生对象。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/RuntimeEvents.java
    value: RuntimeEvents.read
    description: 读取有界、非消费的运行体事实窗口并显式报告截断和游标过期。
- id: solo.runtime.current-context
  kind: invariant
  name: 精确对象与代次必须当前
  summary: 普通动作同时核验捕获世界来源和精确角色/场景对象，不按相同 ID 替换对象或刷新旧 epoch 续权。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/context/NativeContextChecks.java
    value: NativeContextChecks.requireSceneCurrent
    description: 复核角色当前性、实际地图和事件实例，普通跨图与角色失效分别判定。
- id: solo.runtime.true-settlement
  kind: invariant
  name: 真实结算后才完成排空
  summary: Future、动作结果或取消请求先完成均不能代替 body 和 carrier 真实退出；自身回调内等待返回 SELF_WAIT。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/execution/ExecutionScope.java
    value: ExecutionScope.awaitDrained
    description: 等待作用域全部真实工作与资源排空，并明确区分超时、中断和未核验。
- id: solo.runtime.exact-release
  kind: invariant
  name: 清理只属于原根与原资源
  summary: 清理许可必须绑定原根作用域、原 CleanupAttempt 和原角色 identity；迟到创建结果仍记原宿主债务，不取得新世界行动权。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime.releaseOrigin
    description: 拒绝外来根、外来清理尝试及未结束模块，只有来源释放正证据才能确认登记释放。
- id: solo.runtime.unique-lane
  kind: invariant
  name: 同一角色只有一个执行通道
  summary: 根宿主拥有唯一 lane，模块借用授权；停止局部模块不登出角色、不关闭角色通道，调用已有动作不再嵌套排队。
  aliases: []
  anchors:
  - kind: symbol
    file: beidou-integration/src/main/java/soloMapling/game/runtime/CharacterRuntime.java
    value: CharacterRuntime
    description: 在原生 OPEN 前建立唯一 lane 和 root scope，并持有角色的最终关闭责任。
