flows:
- id: solo.runtime.modules.flow
  name: 停止模块并按排空结果结束
  summary: 暂停和卸载只影响本模块，未排空时保留停止状态，不宣称完成。
  scenario: solo.runtime.modules
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 撤销本模块控制
    summary: 停止输入、撤 Grant，并开始本模块 scope 排空。
    concept: solo.runtime.modules
  - id: drained
    kind: decision
    name: 本模块是否真实退出
    summary: 核对 work、相关 Grant、资源与生命周期 hook。
    concept: solo.runtime.true-settlement
  - id: waiting
    kind: outcome
    name: 继续等待或报告失败
    summary: 超时、自等待或资源未知时不确认卸载，不关闭角色。
  - id: mode
    kind: decision
    name: 请求暂停还是卸载
    summary: 两种模式在排空后保留不同模块状态。
  - id: paused
    kind: outcome
    name: 模块暂停且角色保留
    summary: 保留模块配置与原生角色，恢复需新执行代次。
  - id: unloaded
    kind: outcome
    name: 模块卸载且角色保留
    summary: 完成卸载回调并移除模块，不关闭宿主 lane。
  transitions:
  - from: request
    to: drained
  - from: drained
    to: waiting
    when: 尚未真实排空或存在未核验债务
  - from: drained
    to: mode
    when: 工作、资源、授权和回调全部结束
  - from: mode
    to: paused
    when: PAUSE
  - from: mode
    to: unloaded
    when: UNLOAD
- id: solo.runtime.close-role.flow
  name: 根角色关闭
  summary: 所有模块结束、来源释放和真实结算分别核验。
  scenario: solo.runtime.close-role
  startsAt: stop
  steps:
  - id: stop
    kind: action
    name: 停止全部模块
    summary: 根宿主转入 CLOSING 并卸载所有模块。
    concept: solo.runtime.close-role
  - id: modules
    kind: decision
    name: 模块是否全部结束
    summary: 仍有 work 或生命周期回调时等待。
    concept: solo.runtime.true-settlement
  - id: pending
    kind: outcome
    name: 保留关闭中状态
    summary: 尚未结束或证据未知时保留资源与失败事实。
  - id: release
    kind: action
    name: 按根许可调用来源释放
    summary: 在精确清理执行体调用原来源正常退出。
    concept: solo.runtime.release-origin
  - id: proof
    kind: decision
    name: 来源释放与全部结算是否已证实
    summary: 核对原生释放证明、根工作、资源和物理 lane。
    concept: solo.runtime.exact-release
  - id: closed
    kind: outcome
    name: 宿主 CLOSED
    summary: 全部债务结束后关闭 lane 及宿主拥有的 executor。
  transitions:
  - from: stop
    to: modules
  - from: modules
    to: pending
    when: 模块尚未结束
  - from: modules
    to: release
    when: 全部模块结束
  - from: release
    to: proof
  - from: proof
    to: pending
    when: 释放未证实或还有未结算工作
  - from: proof
    to: closed
    when: 来源释放已证实且全部真实排空
