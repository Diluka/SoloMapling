flows:
- id: beidou.economy.direct-trade.flow
  name: 直接交易的确认、拒绝与结算
  summary: 从交易建立到双方确认，保留等待、主动取消、校验失败返还和成功结算的不同结果。
  scenario: beidou.economy.direct-trade
  startsAt: offer
  steps:
  - id: offer
    kind: action
    name: 建立交易并提交报价
    summary: 邀请被接受后暂存双方交出的物品及金币。
    concept: beidou.economy.direct-trade
  - id: confirm
    kind: decision
    name: 双方是否继续并完成确认
    summary: 确认之前可继续等待或由一方取消；只有双方握手完成才进入接收条件检查。
  - id: waiting
    kind: outcome
    name: 保持交易待确认
    summary: 尚未完成双方确认，不进行资产交换。
  - id: check
    kind: decision
    name: 双方接收条件和限额是否通过
    summary: 检查金币接收上限、背包和唯一物品限制、低等级交易限额。
    concept: beidou.economy.exchange-rules
  - id: cancel
    kind: action
    name: 取消并处理暂存报价
    summary: 校验失败先解锁，沿取消握手返还正常待交换资产并清除交易。
    concept: beidou.economy.cancel-trade
  - id: returned
    kind: outcome
    name: 正常未交换报价被返还
    summary: 取消结束双方交易，既有报价不进入成功交换路径。
  - id: settle
    kind: action
    name: 互换物品并结算金币费用
    summary: 双方取得对方报价中的物品和扣除交易费的金币，并清除交易状态。
    concept: beidou.economy.direct-trade
  - id: done
    kind: outcome
    name: 双方交换完成
    summary: 本次原生交易完成；不据此宣称数据库跨角色事务已验收。
  transitions:
  - from: offer
    to: confirm
  - from: confirm
    to: check
    when: 双方完成确认
  - from: confirm
    to: cancel
    when: 一方取消
  - from: confirm
    to: waiting
    when: 尚有一方未确认
  - from: check
    to: settle
    when: 双方条件通过
  - from: check
    to: cancel
    when: 接收条件或限额失败
  - from: cancel
    to: returned
  - from: settle
    to: done
- id: beidou.economy.cash-shop.flow
  name: 商城购买的余额与容量分支
  summary: 购买单品或礼包前先核对资格与余额，再核对现金仓库容量，满足才扣点入库。
  scenario: beidou.economy.cash-shop
  startsAt: eligible
  steps:
  - id: eligible
    kind: decision
    name: 商城已打开且商品与购买资格有效
    summary: 核对商城状态、商品及余额，并处理品类、等级和配置限制。
    concept: beidou.economy.cash-shop
  - id: capacity
    kind: decision
    name: 现金仓库能否容纳本次商品
    summary: 单品检查一个名额，礼包检查整包物品数量。
    concept: beidou.economy.assets-in-custody
  - id: refused
    kind: outcome
    name: 购买未被执行
    summary: 该购买路径未扣点或加入本次物品，返回对应拒绝或容量提示。
  - id: buy
    kind: action
    name: 扣点并加入现金仓库
    summary: 按指定点券类型扣款，将商品或礼包物品加入现金仓库。
    concept: beidou.economy.cash-shop
  - id: owned
    kind: outcome
    name: 商品位于现金仓库
    summary: 购买回执发出，角色背包领取是后续独立操作。
  transitions:
  - from: eligible
    to: capacity
    when: 商品、资格与余额通过
  - from: eligible
    to: refused
    when: 商城、商品或购买条件不符
  - from: capacity
    to: buy
    when: 容量足够
  - from: capacity
    to: refused
    when: 容量不足
  - from: buy
    to: owned
