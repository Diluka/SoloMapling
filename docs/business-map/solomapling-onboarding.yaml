schemaVersion: 1
map:
  id: solo.onboarding
  title: SoloMapling · 教程与新玩家引导
  summary: 如实记录教程参与、真人GM与成长变更、资金物品赠送和武器改造；不承诺已启用或已验。
nodes:
- id: solo.onboarding
  kind: domain
  name: SoloMapling 教程与新玩家引导
  summary: TutorialBot 提供交互式教学，但源码还包含对真人授 GM6、成长变更、赠礼与武器改造。这里记录既有源码，不证明北斗环境已启用、可安全使用或完成实际验收。
  aliases: []
  anchors:
  - kind: file
    value: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    description: 教程状态机及全部业务副作用。
- id: solo.onboarding.tutorial
  kind: scenario
  name: 参与机器人教程
  summary: 发现范围内尚未帮助的玩家后询问是否参加；拒绝转入送别，同意后仍有权限选择、礼品交易、选帽和武器处理等分支。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.updateState
    description: 编排教程、拒绝、赠礼、武器处理和送别状态。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.waitForNewPlayer
    description: 按距离与本进程帮助记录挑选交互者。
- id: solo.onboarding.state
  kind: data
  name: 教程进度与本进程帮助记录
  summary: 保存本轮参与/授予选择、当前武器对象、兑换码、时间窗及已帮助 CID；不是持久新手任务系统。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.resetTutorialBotState
    description: 清除本轮选择和临时数据以开始下一轮。
- id: solo.onboarding.grant
  kind: operation
  name: 授予真人权限与成长
  summary: 玩家在教程中答 Yes 后，源码把 Character 与 Client 的 GM 等级设为6，设 level149再levelUp、转职412、增加AP750/SP450并改HP/MP；再生成两码字符串并各尝试写入25000点NX记录。两表写入可失败或不完整，教程不检查结果且此前权限成长不回滚；方法内未见独立管理员授权门槛。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.grantAdmin
    description: 修改当前真人权限、等级职业与成长，再尝试创建兑换码，不以代码字符串证明有效记录。
  - kind: symbol
    file: src/main/java/soloMapling/server/NXCodeManager.java
    value: NXCodeManager.createCompleteNXCode
    description: 分两次独立数据库连接写码表和内容表，失败可不完整，非原子发码。
- id: solo.onboarding.gift
  kind: operation
  name: 通过交易赠送资金与物品
  summary: 主动邀请交易；检测到 full trade 后安排托管10亿金币、药水、苹果、回城卷、飞镖与装备并调用确认。已有trade但超时会取消并继续教程；trade为null时提前返回，不保证此等待路径会超时结束。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.initiateGiftTrade
    description: 向当前玩家发出赠礼交易邀请。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.waitForTradeAccept
    description: 检查full trade，明确trade缺失与已有trade超时两条路径。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.placeTradeItems
    description: 安排金币与物品赠送并调用原生交易确认，不以void返回证明结算。
- id: solo.onboarding.choose-hat
  kind: operation
  name: 用掉落与回答演示选帽
  summary: 在地图摆出三件帽子，玩家按名字回答后清理未选择帽子；回答选择不等于已经原生拾取，选择等待存在时间窗。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.tutorial_2_drops
    description: 在地图生成候选帽子与提示。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.handleTutPickResponse
    description: 按帽子名字匹配回答。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.handleSelectedHat
    description: 记录选择并延时清理其余帽子。
- id: solo.onboarding.upgrade-weapon
  kind: operation
  name: 处理玩家掉落武器并返还
  summary: 读取玩家当前武器ID，等待附近同ID的地面装备，移除这些掉落后用卷轴2043003改造并重投；源码按位置与ID查找，未证明精确个人托管、自动回滚或完整返还保证。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.analyzePlayersWeapon
    description: 读取当前装备武器ID决定是否进入等待。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.lootPlayersDroppedWeapon
    description: 按附近掉落和item ID选择装备并移除匹配掉落。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.scrollPlayersDroppedWeapon
    description: 调用北斗卷轴改造并设置owner文案。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.returnUpgradedWeapon
    description: 以地图掉落形式返还改造装备。
- id: solo.onboarding.finish
  kind: operation
  name: 送别并恢复等待位置
  summary: 播放送别、引导机器人到出口并投放苹果，把玩家加入本进程已帮助列表；回到录制路径起点后清除交互者。拒绝参加也进入此路径，不能视为零副作用拒绝。
  aliases: []
  anchors:
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.send_off
    description: 执行送别文案、移动与礼物。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.send_off_parting_gift
    description: 丢出苹果并登记已帮助CID。
  - kind: symbol
    file: src/main/java/soloMapling/ArtificialPlayer/BotTypes/TutorialBot.java
    value: TutorialBot.returnOrigin
    description: 沿旧录制动作回到等待位置。
