flows:
- id: solo.onboarding.tutorial.flow
  name: 教程选择及真人副作用
  summary: 呈现参加/拒绝、授予选择、交易等待与教学关键分支，不把方法受理或文案当实际结算证明。
  scenario: solo.onboarding.tutorial
  startsAt: participate
  steps:
  - id: participate
    kind: decision
    name: 玩家是否参加教程
    summary: 未回复可能超时退出本轮；拒绝也有送别赠礼。
  - id: admin
    kind: decision
    name: 是否答应授予权限
    summary: 教程直接根据当前玩家Yes/No文本决定授予分支。
  - id: grant
    kind: action
    name: 修改真人权限成长并尝试记录兑换码
    summary: GM6及成长先变更，再生成两码字符串并尝试写表；发码失败不回滚之前副作用。
    concept: solo.onboarding.grant
  - id: gift
    kind: action
    name: 发起并等待礼品交易
    summary: 已有交易和缺失交易路径按当前源码分别处理。
    concept: solo.onboarding.gift
  - id: trade
    kind: decision
    name: 礼品交易到达何种状态
    summary: 仅full trade会安排赠品和原生确认。
  - id: pending
    kind: outcome
    name: 继续等待未建立的交易
    summary: trade为null时检查提前返回，不能声称必然超时。
  - id: hat
    kind: action
    name: 演示选帽
    summary: 摆放帽子并等待名字回答。
    concept: solo.onboarding.choose-hat
  - id: hat-result
    kind: decision
    name: 帽子选择是否完成
    summary: 名字无匹配仍等待，时间窗耗尽停止本轮。
  - id: weapon
    kind: decision
    name: 是否读到当前武器ID
    summary: 没有武器时跳过改造。
  - id: upgrade
    kind: action
    name: 等待并改造地面装备
    summary: 只有找到近处匹配ID装备后才继续；缺失时保持等待，不保证托管返还。
    concept: solo.onboarding.upgrade-weapon
  - id: sendoff
    kind: action
    name: 送别并赠送苹果
    summary: 拒绝参加也执行此动作。
    concept: solo.onboarding.finish
  - id: finished
    kind: outcome
    name: 机器人返回等待
    summary: 当前玩家记入进程内已帮助集合。
  - id: timeout
    kind: outcome
    name: 本轮等待响应超时
    summary: 状态进入FINISHED并重置本轮教程变量，不声称执行完整送别。
  transitions:
  - from: participate
    to: admin
    when: Yes参加
  - from: participate
    to: sendoff
    when: No拒绝参加
  - from: participate
    to: timeout
    when: 未在时间窗答复
  - from: admin
    to: grant
    when: Yes同意授予
  - from: admin
    to: hat
    when: No不授予
  - from: admin
    to: timeout
    when: 未在时间窗答复
  - from: grant
    to: gift
  - from: gift
    to: trade
  - from: trade
    to: hat
    when: full trade并已安排赠品确认
  - from: trade
    to: hat
    when: 已有trade但等待超时取消
  - from: trade
    to: pending
    when: trade仍为null或尚在等待
  - from: hat
    to: hat-result
  - from: hat-result
    to: weapon
    when: 成功匹配帽子名字
  - from: hat-result
    to: timeout
    when: 选择时间窗耗尽
  - from: weapon
    to: upgrade
    when: 可读取非零武器ID
  - from: weapon
    to: sendoff
    when: 没有可读取武器
  - from: upgrade
    to: sendoff
  - from: sendoff
    to: finished
