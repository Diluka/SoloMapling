flows:
- id: beidou.social.party-membership.flow
  name: 受邀加入原生队伍
  summary: 邀请时检查资格与容量，接受时消费有效邀请，再次复核实际队伍状态，保留拒绝和失效结果。
  scenario: beidou.social.party-membership
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 申请邀请玩家
    summary: 邀请者按名字选择世界在线目标。
    concept: beidou.social.party-membership
  - id: eligible
    kind: decision
    name: 是否允许发出邀请
    summary: 检查目标在线、等级、已有队伍、创建资格及队伍六人容量。
    concept: beidou.social.party-membership
  - id: refused
    kind: outcome
    name: 未发出邀请
    summary: 离线、不符合资格、已有队伍、满员或邀请冲突均不能建立成员关系。
  - id: invited
    kind: action
    name: 发出原生邀请
    summary: 必要时先创建队伍，登记邀请并通知目标。
    concept: beidou.social.party-membership
  - id: answer
    kind: decision
    name: 邀请答案是否有效且接受
    summary: 拒绝或邀请失效不允许入队；接受仍需有效邀请。
    concept: beidou.social.party-membership
  - id: unjoined
    kind: outcome
    name: 邀请未转为成员
    summary: 拒绝、超时或邀请失效不建立成员关系。
  - id: joinable
    kind: decision
    name: 受邀队伍现在能否加入
    summary: 再次检查目标未入其他队、队伍仍存在且未满员。
    concept: beidou.social.party-membership
  - id: joined
    kind: outcome
    name: 成员关系建立
    summary: 更新队伍成员、地图成员和组队状态。
    concept: beidou.social.party
  - id: join-refused
    kind: outcome
    name: 接受后仍无法加入
    summary: 已有队伍、队伍已解散或已满员时保留原成员状态。
  transitions:
  - from: request
    to: eligible
  - from: eligible
    to: refused
    when: 目标、等级、队伍容量或邀请状态不允许
  - from: eligible
    to: invited
    when: 满足原生邀请条件
  - from: invited
    to: answer
  - from: answer
    to: unjoined
    when: 拒绝或邀请已失效
  - from: answer
    to: joinable
    when: 接受且邀请有效
  - from: joinable
    to: joined
    when: 角色未入队且目标队伍存在并未满员
  - from: joinable
    to: join-refused
    when: 角色已入队或目标队伍消失或满员
- id: beidou.social.general-chat.flow
  name: 普通地图发言
  summary: 普通发言保留原生频率、长度、命令及禁言分支，广播只代表该处理器已向选定范围发送包。
  scenario: beidou.social.general-chat
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 提交聊天正文
    summary: 读取原生聊天正文与当前角色。
    concept: beidou.social.general-chat
  - id: basic
    kind: decision
    name: 原生频率与长度是否通过
    summary: 先检查200毫秒原生缓存时钟间隔，再按普通玩家长度限制处理。
    concept: beidou.social.chat-rules
  - id: blocked
    kind: outcome
    name: 不广播本次正文
    summary: 频率不足会拒绝；非法过长普通玩家文本会触发告警并断开。
  - id: route
    kind: decision
    name: 正文属于哪类入口
    summary: 命令交给命令执行器，普通非斜杠正文进入地图聊天。
    concept: beidou.social.general-chat
  - id: other
    kind: outcome
    name: 命令或斜杠入口结束
    summary: 命令按自己的规则执行，非命令斜杠正文不作为普通地图广播。
  - id: muted
    kind: decision
    name: 地图是否允许该角色发言
    summary: 非GM受地图禁言限制。
    concept: beidou.social.general-chat
  - id: forbidden
    kind: outcome
    name: 地图禁言拒绝
    summary: 返回禁言提示，本次正文不广播。
  - id: broadcast
    kind: outcome
    name: 按身份范围广播
    summary: 可见角色向地图广播，隐身角色只向GM广播，并记录本次频率。
    concept: beidou.social.chat
  transitions:
  - from: request
    to: basic
  - from: basic
    to: blocked
    when: 原生频率不足或普通玩家正文过长
  - from: basic
    to: route
    when: 频率与长度通过
  - from: route
    to: other
    when: 命令或非命令斜杠正文
  - from: route
    to: muted
    when: 普通非斜杠正文
  - from: muted
    to: forbidden
    when: 地图禁言且角色不是GM
  - from: muted
    to: broadcast
    when: 地图未禁言或角色是GM
