schemaVersion: 1
map:
  id: beidou-social
  title: 北斗：社交与组织
  summary: 固定上游北斗1.12的玩家聊天、好友、队伍、公会联盟、家族及婚姻业务。
nodes:
- id: beidou.social
  kind: domain
  name: 北斗社交与组织
  summary: 上游北斗拥有玩家沟通、好友、队伍、公会联盟、家族与婚姻关系的规则和状态；此图依据固定1.12源码，不表示已完成实际玩法验收。
  aliases:
  - 聊天
  - 组队
  - 好友
  - 公会
  - 家族
  - 婚姻
  anchors:
  - kind: directory
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server
    description: 世界级社交成员、组织与邀请协调的实现入口。
- id: beidou.social.chat
  kind: interface
  name: 原生聊天派发与广播
  summary: 游戏客户端及Solo适配沿原生聊天处理器派发；普通聊天、私聊和组织聊天各自决定接收者与限制。
  aliases:
  - GeneralChatHandler
  - CHATTEXT
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/GeneralChatHandler.java
    value: GeneralChatHandler.handlePacket
    description: 普通发言经原生频率、命令和地图禁言检查后广播。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/MultiChatHandler.java
    value: MultiChatHandler.handlePacket
    description: 好友、队伍、公会与联盟聊天沿组织路由发送。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/WhisperHandler.java
    value: WhisperHandler.handlePacket
    description: 按目标在线状态处理私聊与查找。
- id: beidou.social.general-chat
  kind: scenario
  name: 在当前地图发言
  summary: 普通发言先受200毫秒原生缓存时钟限频、长度、命令入口、斜杠与地图禁言规则约束；隐身角色只向GM广播。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/GeneralChatHandler.java
    value: GeneralChatHandler.handlePacket
    description: 区分命令与普通发言，并向地图或GM广播真实聊天包。
- id: beidou.social.direct-chat
  kind: operation
  name: 私聊与查找在线玩家
  summary: 按世界在线角色查找目标；位置查找受GM级别限制，私聊受频率和长度限制，目标离线返回未找到。
  aliases:
  - 密语
  - whisper
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/WhisperHandler.java
    value: WhisperHandler.handlePacket
    description: 分派位置查找与私聊请求。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/WhisperHandler.java
    value: WhisperHandler.handleWhisper
    description: 按200毫秒频率与长度检查发送私聊。
- id: beidou.social.group-chat
  kind: operation
  name: 向好友或所属组织发言
  summary: 好友消息使用收件人列表；队伍、公会与联盟消息需要实际所属关系，并经对应世界或服务器广播入口发送。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/MultiChatHandler.java
    value: MultiChatHandler.handlePacket
    description: 选择好友、队伍、公会和联盟的聊天接收范围。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/SpouseChatHandler.java
    value: SpouseChatHandler.handlePacket
    description: 依据伴侣ID向在线配偶发送消息，离线明确提示。
- id: beidou.social.messenger
  kind: scenario
  name: 建立邀请式聊天会话
  summary: 玩家创建、邀请加入、发言和退出Maple Messenger；加入需有效邀请，房间最多三人。
  aliases:
  - Maple Messenger
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/MessengerHandler.java
    value: MessengerHandler.handlePacket
    description: 处理三人聊天会话创建、受邀加入、邀请、退出和聊天。
- id: beidou.social.friends
  kind: scenario
  name: 维护好友关系
  summary: 申请好友、接受、分组与删除各有原生路径；名单容量、目标存在和待确认状态决定结果，接受会持久化双方正式关系。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/BuddylistModifyHandler.java
    value: BuddylistModifyHandler.handlePacket
    description: 处理好友申请、接受、分组变更及删除。
- id: beidou.social.friend-list
  kind: data
  name: 好友名单与待确认关系
  summary: 好友ID、分组、可见/待确认状态、容量与在线频道信息由原生好友系统维护。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/BuddyList.java
    description: 内存好友名单与容量。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/BuddylistEntry.java
    description: 单项好友关系与分组、频道、可见状态。
- id: beidou.social.party-membership
  kind: scenario
  name: 创建、加入及结束队伍关系
  summary: 创建、邀请、接受、离队、队长解散、踢人与转移队长沿原生队伍路径更新；离队和解散还通知正在参与的事件实例。
  aliases:
  - 组队
  - 入队
  - 退队
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PartyOperationHandler.java
    value: PartyOperationHandler.handlePacket
    description: 处理组队协议操作和邀请答案。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/Party.java
    value: Party.joinParty
    description: 加入时复核已有队伍、目标队伍存在和六人容量。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/Party.java
    value: Party.leaveParty
    description: 区分成员离队与队长解散，并通知事件实例。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/DenyPartyRequestHandler.java
    value: DenyPartyRequestHandler.handlePacket
    description: 拒绝真实组队邀请并通知邀请者，不建立队伍成员关系。
- id: beidou.social.party
  kind: data
  name: 队伍成员与队长关系
  summary: 世界级队伍持有队伍ID、成员、队长、历史成员和相关门；社交域拥有成员关系，任务域据此决定实例资格。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/Party.java
    description: 队伍、成员与队长的原生状态声明。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/world/PartyCharacter.java
    description: 队伍成员的角色投影。
- id: beidou.social.party-search
  kind: operation
  name: 按等级职业招募队员
  summary: 队长提交包含自身等级且跨度不超过30级的招募条件；协调器按邻近地图、职业和等级寻找候选并发送邀请；满员结束当前搜索，重试达到阈值的在线队长可转长期等待队列后再进入搜索。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/PartySearchStartHandler.java
    value: PartySearchStartHandler.handlePacket
    description: 核验等级区间及队长身份后登记招募。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/coordinator/partysearch/PartySearchCoordinator.java
    value: PartySearchCoordinator.runPartySearch
    description: 寻找候选、发送邀请，满员收束并将适用的超限搜索转长期等待。
- id: beidou.social.guild
  kind: scenario
  name: 创建与维护公会
  summary: 创建需名称、金币和合格伙伴确认；邀请加入、退出、踢人、职级、徽章与公告由成员身份和权限控制，解散清理持久公会并协调联盟归属。
  aliases:
  - 行会
  - guild
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/GuildOperationHandler.java
    value: GuildOperationHandler.handlePacket
    description: 处理公会创建资格、成员邀请/退出及管理权限。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/guild/Guild.java
    value: Guild.disbandGuild
    description: 移除联盟关系、删除持久公会并广播解散。
- id: beidou.social.guild-state
  kind: data
  name: 公会成员与管理状态
  summary: 公会名称、成员职级、容量、徽章、公告、联盟归属和积分由原生公会对象及持久化维护。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/guild/Guild.java
    description: 公会信息、成员与管理状态。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/dao/entity/GuildsDO.java
    description: 公会持久化记录。
- id: beidou.social.alliance
  kind: operation
  name: 维护公会联盟
  summary: 公会邀请加入或退出联盟，联盟管理员管理公会、成员职级和公告；成员身份、权限、有效邀请与联盟容量决定是否受理。
  aliases:
  - 联盟
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/AllianceOperationHandler.java
    value: AllianceOperationHandler.handlePacket
    description: 检查公会、联盟成员关系与职级，处理邀请和联盟变更。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/guild/Alliance.java
    value: Alliance.disbandAlliance
    description: 解除联盟中各公会的归属并删除联盟记录。
- id: beidou.social.family
  kind: scenario
  name: 加入、合并与脱离家族
  summary: 家族开关启用后，玩家依同图、等级差、代数和邀请规则建立上下级关系或合并家族；分离需真实关系且支付按等级差计算的金币，并扣减上级声望。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/FamilyAddHandler.java
    value: FamilyAddHandler.handlePacket
    description: 检查同图、等级与代数后发出家族邀请。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/AcceptFamilyHandler.java
    value: AcceptFamilyHandler.handlePacket
    description: 消费邀请并创建、加入或合并家族，保存新关系。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/FamilySeparateHandler.java
    value: FamilySeparateHandler.handlePacket
    description: 核实上下级关系与金币后分离分支并扣减声望。
- id: beidou.social.family-tree
  kind: data
  name: 家族谱系与声望权益
  summary: 家族的领导者、上下级、代数、声望与权益使用记录由家族及家族成员对象维护。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/Family.java
    description: 家族组织与谱系生命周期。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/client/FamilyEntry.java
    description: 上下级、声望和权益使用状态。
- id: beidou.social.family-benefits
  kind: operation
  name: 使用家族声望权益
  summary: 权益检查家族开关、剩余声望及已使用状态；重聚/召集继续核家族和地图限制，个人或组队增益按对应路径发放并记录权益消耗。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/FamilyUseHandler.java
    value: FamilyUseHandler.handlePacket
    description: 检查声望、权益和地图限制，执行家族出行或增益。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/FamilyUseHandler.java
    value: FamilyUseHandler.useEntitlement
    description: 权益登记成功时扣除声望并刷新家族信息。
- id: beidou.social.marriage
  kind: scenario
  name: 订婚、婚姻与礼物互动
  summary: 求婚核双方关系、等级、同图、性别、戒指与背包资格；答复、取消和解除关系走原生戒指动作，婚礼礼物沿婚礼实例检查赠送/领取资格和容量。
  aliases:
  - 订婚
  - 结婚
  - 婚礼
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/RingActionHandler.java
    value: RingActionHandler.sendEngageProposal
    description: 核实双方关系和道具资格后发起求婚。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/RingActionHandler.java
    value: RingActionHandler.handlePacket
    description: 处理求婚答复、取消、解除、婚礼邀请与愿望单。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/WeddingHandler.java
    value: WeddingHandler.handlePacket
    description: 在婚礼实例中赠送或领取礼物，并处理未领礼物。
- id: beidou.social.marriage-state
  kind: data
  name: 伴侣关系与婚礼礼物状态
  summary: 角色伴侣及戒指字段、婚姻记录、婚礼实例的愿望单和礼物共同承载婚姻业务；物品本体仍归经济域。
  aliases: []
  anchors:
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/dao/entity/MarriagesDO.java
    description: 持久化婚姻记录。
  - kind: file
    value: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/server/Marriage.java
    description: 婚礼事件实例、愿望单、赠礼与未领取礼物。
- id: beidou.social.chat-rules
  kind: invariant
  name: 保留各聊天路径原生限制
  summary: 普通聊天、私聊与组织聊天分别执行源码规定的长度、频率、收件范围及隐藏身份规则；不能由某一路径通过推断其他路径也具备相同检查。
  aliases: []
  anchors:
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/GeneralChatHandler.java
    value: GeneralChatHandler.handlePacket
    description: 普通聊天使用原生时钟限频、命令分流和地图禁言。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/WhisperHandler.java
    value: WhisperHandler.handleWhisper
    description: 私聊使用自身限频与长度规则。
  - kind: symbol
    file: upstream/BeiDou-Server/gms-server/src/main/java/org/gms/net/server/channel/handlers/MultiChatHandler.java
    value: MultiChatHandler.handlePacket
    description: 组织聊天按实际成员关系路由。
