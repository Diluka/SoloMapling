  to: beidou.economy.wallet
  summary: 运营金币与点券发放先按GiveService上下界处理，再调用原生gainMeso或gainCash。
- from: beidou.operations.manage-resources
  type: writes
  to: beidou.combat.growth
  summary: 运营经验发放调用Character.gainExp，沿原生成长规则改变角色经验与可能的升级结果。
- from: beidou.operations.maintain-content
  type: consumes
  to: beidou.world.events
  summary: CommandService事件重载逐频道调用reloadEventScriptManager，取消旧脚本管理器并重建。
flows:
- id: beidou.operations.admin-login.flow
  name: 取得令牌与取得管理资格
  summary: 把账号密码正确、JWT有效和当前管理员资格分别核对；不采用Swagger测试分支。
  scenario: beidou.operations.admin-login
  startsAt: credentials
  steps:
  - id: credentials
    kind: action
    name: 提交账号密码
    summary: 请求AuthController登录。
    concept: beidou.operations.admin-login
  - id: password
    kind: decision
    name: 账号密码是否正确
    summary: AuthService读取账号并比较密码。
  - id: token
    kind: action
    name: 签发JWT
    summary: 正确凭据取得令牌。
    concept: beidou.operations.admin-session
  - id: request
    kind: action
    name: 请求受保护管理API
    summary: 携带Bearer令牌访问正常管理接口。
    concept: beidou.operations.admin-api
  - id: authority
    kind: decision
    name: 令牌和当前管理员是否有效
    summary: 正常路径同时核JWT及webadmin=1的用户加载。
    concept: beidou.operations.admin-authorized
  - id: allowed
    kind: outcome
    name: 允许正常管理请求
    summary: 请求继续进入其管理业务，业务自身仍可能拒绝。
  - id: refused
    kind: outcome
    name: 无法取得管理访问
    summary: 凭据错误、无效令牌或当前非管理员时不进入正常管理业务。
  transitions:
  - from: credentials
    to: password
  - from: password
    to: token
    when: 账号存在且密码匹配
  - from: password
    to: refused
    when: 账号不存在或密码不匹配
  - from: token
    to: request
  - from: request
    to: authority
  - from: authority
    to: allowed
    when: JWT有效且当前webadmin=1
  - from: authority
    to: refused
    when: JWT无效或无法加载当前管理员
