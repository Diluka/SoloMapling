flows:
- id: beidou.combat.attack.flow
  name: 攻击到击杀成长
  summary: 展示原生攻击的拒绝、未击杀与击杀收益分支；攻击广播与最终命中并非同一事实。
  scenario: beidou.combat.attack
  startsAt: attack
  steps:
  - id: attack
    kind: action
    name: 提交原生攻击
    summary: 读取攻击报告，取得当前地图与技能上下文。
    concept: beidou.combat.attack
  - id: eligibility
    kind: decision
    name: 原生条件是否允许结算
    summary: 地图归属、存活、技能效果及目标数量等条件可拒绝结算。
    concept: beidou.combat.native-rules
  - id: refused
    kind: outcome
    name: 攻击未进入伤害结算
    summary: 按对应原生拒绝规则结束；不得推定命中。
  - id: damage
    kind: action
    name: 扣减怪物生命
    summary: 按怪物状态和技能规则应用本次伤害。
    concept: beidou.combat.attack
  - id: death
    kind: decision
    name: 怪物是否因此死亡
    summary: 地图依怪物真实生命值判断击杀。
  - id: alive
    kind: outcome
    name: 怪物仍存活
    summary: 保留当前伤害贡献和战斗状态。
  - id: settle
    kind: action
    name: 结算击杀与参与收益
    summary: 移除怪物，按贡献和队伍规则发经验并处理掉落。
    concept: beidou.combat.settle-kill
  - id: growth
    kind: action
    name: 按角色成长规则记经验
    summary: 依据经验开关、等级上限和升级门槛更新获益角色。
    concept: beidou.combat.gain-level
  - id: done
    kind: outcome
    name: 击杀收益已按规则处理
    summary: 达到升级条件时成长；并非每次击杀都升级或保证掉落。
  transitions:
  - from: attack
    to: eligibility
  - from: eligibility
    to: refused
    when: 地图或角色、技能、目标条件拒绝
  - from: eligibility
    to: damage
    when: 本次结算条件满足
  - from: damage
    to: death
  - from: death
    to: alive
    when: 怪物仍有生命
  - from: death
    to: settle
    when: 本次伤害触发死亡
  - from: settle
    to: growth
  - from: growth
    to: done
- id: beidou.combat.recover-life.flow
  name: 死亡后的原生复活选择
  summary: 死亡损失和事件死亡回调在死亡处理发生；之后复活请求按道具、事件和返回地图分路。
  scenario: beidou.combat.recover-life
  startsAt: request
  steps:
  - id: request
    kind: action
    name: 死亡角色请求复活
    summary: 进入原生切图处理器中的死亡分支。
    concept: beidou.combat.recover-life
  - id: wheel
    kind: decision
    name: 请求并持有命运之轮
    summary: 只有请求使用且确有对应道具时走道具复活。
  - id: consume
    kind: action
    name: 消耗道具并在当前地图复活
    summary: 移除一个命运之轮，恢复指定生命并选择近处出生点。
    concept: beidou.combat.recover-life
  - id: event
    kind: decision
    name: 事件是否接管复活
    summary: 存在事件时调用revivePlayer，由其返回值决定是否执行标准路径。
  - id: handled
    kind: outcome
    name: 由事件处理后续
    summary: 事件不授权标准返回路径，结果由该事件规则决定。
  - id: return
    kind: action
    name: 按地图返回点复活
    summary: 没有事件或事件允许标准路径时调用原生respawn。
    concept: beidou.combat.recover-life
  - id: restored
    kind: outcome
    name: 按原生路径完成复活
    summary: 角色在对应地图继续；不恢复死亡时已结算的正常损失。
  transitions:
  - from: request
    to: wheel
  - from: wheel
    to: consume
    when: 请求使用且持有道具
  - from: wheel
    to: event
    when: 未请求使用或没有道具
  - from: consume
    to: restored
  - from: event
    to: handled
    when: 当前事件接管且不走标准复活
  - from: event
    to: return
    when: 无事件或事件允许标准复活
  - from: return
    to: restored
