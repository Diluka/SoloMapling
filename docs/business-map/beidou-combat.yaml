- from: beidou.combat.monster-skills
  type: writes
  to: beidou.combat.monsters
  summary: 更新怪物技能占用和仇恨状态。
- from: beidou.combat.gain-level
  type: writes
  to: beidou.identity.characters
  summary: 成长变化由原生角色对象承载并随角色存档持久化。
- from: beidou.combat.recover-life
