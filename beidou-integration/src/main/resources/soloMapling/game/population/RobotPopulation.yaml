types:
  mcp_test:
    modules:
      mcp:
        type: mcp-control
        config: {}
      navigation:
        type: navigation
        config:
          arrival_tolerance_px: 8
          timeout_ms: 30000
          stalled_timeout_ms: 3000
      combat:
        type: combat
        config:
          timeout_ms: 30000
      native:
        type: native-actions
        config: {}
      potions:
        type: potions
        config:
          restore_cooldown_ms: 5000
          cleanse_cooldown_ms: 5000
      hunting:
        type: hunting-control
        config: {}
      recovery:
        type: recovery-control
        config:
          hp_threshold_pct: 50
          mp_threshold_pct: 50
          cleanse_enabled: true
          check_interval_ms: 500
      population:
        type: robot-population
        config: {}

initial_population:
  mcp_test: 0
